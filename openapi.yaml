    RouterCreateColumnHashingSaltRequest:
      properties:
        description:
          description: Free-text notes about the salt.
          type: string
        name:
          description: Display name for the salt.
          type: string
        salt:
          description: 'The salt to hash with. Left empty, Artie generates one: the
            43-character base64url encoding of 32 random bytes. Hashes are keyed on
            the salt string as given, not on decoded bytes.'
          type: string
      required:
      - name
      type: object
    RouterCreateColumnHashingSaltResponse:
      properties:
        columnHashingSalt:
          $ref: '#/components/schemas/PayloadsColumnHashingSalt'
          description: The new salt.
        salt:
          description: The salt value, given or generated. Only the detail endpoint
            returns it again.
          type: string
      required:
      - columnHashingSalt
      - salt
      type: object
    RouterCreateEncryptionKeyRequest:
      properties:
        description:
          description: Free-text notes about the key.
          type: string
        kmsKeyUUID:
          description: A KMS key from the KMS key list to generate the data key with.
            Left out, Artie generates a passphrase.
          format: uuid
          type:
          - "null"
          - string
        name:
          description: Display name for the key.
          type: string
      required:
      - name
      type: object
    RouterCreateEncryptionKeyResponse:
      properties:
        encryptionKey:
          $ref: '#/components/schemas/PayloadsEncryptionKey'
          description: The new key.
        key:
          description: 'The secret key: the plaintext passphrase, or for kms keys
            the KMS-encrypted data key. Only the detail endpoint returns it again.'
          type: string
      required:
      - encryptionKey
      - key
      type: object
    RouterCreateIngestionAPIKeyRequest:
      properties:
        name:
          description: Display name for the key.
          type: string
        sourceReaderUUID:
          description: The source reader the key sends events to, from source_reader_list.
            Its pipelines are marked as having undeployed changes; a shared reader
            needs source_reader_deploy instead.
          format: uuid
          type: string
      required:
      - sourceReaderUUID
      type: object
    RouterCreateIngestionAPIKeyResponse:
      properties:
        ingestionAPIKey:
          $ref: '#/components/schemas/PayloadsIngestionAPIKey'
          description: The new key.
        secret:
          description: The full secret to send with events. Returned only here; it
            can't be fetched again.
          type: string
      required:
      - ingestionAPIKey
      - secret
      type: object
    RouterCreateKafkaAdminUserRequest:
      properties:
        username:
          description: Lowercase letters, digits, '.' and '-', at most 64 characters.
            Each '.'-separated part starts and ends with a letter or digit. admin,
            artie and names starting with artie-kafka- are reserved.
          type: string
      required:
      - username
      type: object
    RouterCreateKafkaClusterRequest:
      properties:
        allowedCIDRs:
          description: Client IP ranges allowed to reach the cluster. Empty allows
            any IP; clients still need the password.
          items:
            type: string
          type: array
        brokers:
          default: 3
          description: How many brokers to run.
          maximum: 30
          minimum: 3
          type: integer
        instanceType:
          $ref: '#/components/schemas/PayloadsKafkaInstanceType'
          default: r8g.large
          description: The instance type each broker runs on.
        localRetentionBytes:
          description: 'Disk cap per partition: the most broker disk each partition
            of a tiered topic keeps, in bytes, at least 1073741824 (1 GiB). Null is
            no cap.'
          type:
          - "null"
          - integer
        localRetentionMS:
          description: 'Days on disk: how long tiered topics keep data on broker disks,
            in ms, from 86400000 (one day) to 2592000000 (30 days), and no longer
            than retentionMS. Every topic that doesn''t set log.local.retention.ms
            inherits it. Left out is 3 days.'
          type:
          - "null"
          - integer
        name:
          description: The cluster's name, as customers see it. 3 to 100 characters.
            The cluster's ID, which its address and Kubernetes objects use, is generated.
          maxLength: 100
          minLength: 3
          type: string
        region:
          description: The region to run the cluster in. Must be one Managed Kafka
            runs in, or the request gets a 400.
          type: string
        retentionMS:
          description: 'How long topics keep messages unless they set their own retention.ms,
            in ms (the brokers'' log.retention.ms): at least 86400000 (one day), and
            at least the days on disk, or -1 to keep them forever. Left out is 14
            days.'
          type: integer
        storageAutoscale:
          $ref: '#/components/schemas/PayloadsKafkaClusterStorageAutoscale'
          description: How Artie grows the brokers' disks before they fill. Left out
            is on, growing at 65% to 55%, with no limit.
        storageGiB:
          description: 'Disk per broker in GiB: 20, 50 or 80, or any size from 100
            to 1024 (1 TiB). Bigger sizes go through support.'
          maximum: 1024
          minimum: 20
          type: integer
        tieredStorage:
          description: Whether Artie turns tiered storage on for every topic that
            hasn't set it either way. The setup form starts it on.
          type: boolean
      required:
      - name
      - region
      - brokers
      - instanceType
      - storageGiB
      - allowedCIDRs
      - tieredStorage
      type: object
    RouterCreateKafkaTopicRequest:
      properties:
        configEntries:
          additionalProperties:
            type: string
          description: 'Kafka topic configs to set, keyed by config name with string
            values, such as retention.ms: "604800000". The accepted names are cleanup.policy,
            max.message.bytes, min.insync.replicas, retention.bytes and retention.ms.'
          type:
          - object
          - "null"
        partitionCount:
          description: How many partitions to create. Partitions can be added later
            but never removed.
          minimum: 1
          type: integer
        replicationFactor:
          description: How many copies of each partition the brokers keep.
          minimum: 1
          type: integer
        topic:
          description: The new topic's name; . and .. aren't allowed. See the tool
            description for the prefix a BYOC cluster requires.
          pattern: ^[a-zA-Z0-9._-]{1,249}$
          type: string
      required:
      - topic
      - partitionCount
      - replicationFactor
      type: object
    RouterCreateKafkaUserRequest:
      properties:
        accessProfile:
          description: Must be producer_consumer; create admin-profile users with
            POST /kafka-clusters/{uuid}/admin-users.
          type: string
        username:
          description: Lowercase letters, digits, '.' and '-', at most 64 characters.
            Each '.'-separated part starts and ends with a letter or digit. admin,
            artie and names starting with artie-kafka- are reserved.
          type: string
      required:
      - username
      - accessProfile
      type: object
    RouterIncreaseKafkaTopicPartitionsRequest:
      properties:
        currentPartitionCount:
          description: The topic's partition count now, from the topic list.
          type: integer
        newPartitionCount:
          description: The total partition count wanted. Must be more than currentPartitionCount.
          type: integer
      required:
      - currentPartitionCount
      - newPartitionCount
      type: object
    RouterKafkaClusterAdminCredentialsResponse:
      properties:
        bootstrapServers:
          description: Comma-separated host:port addresses clients connect to.
          type: string
        password:
          description: The admin user's password.
          type: string
        saslMechanism:
          description: The Kafka sasl.mechanism clients use.
          type: string
        securityProtocol:
          description: The Kafka security.protocol clients use.
          type: string
        username:
          description: The admin user's Kafka username.
          type: string
      required:
      - username
      - password
      - bootstrapServers
      - securityProtocol
      - saslMechanism
      type: object
    RouterKafkaClusterAdminPasswordRotateResponse:
      properties:
        password:
          description: The new admin password. Shown once, unless the response has
