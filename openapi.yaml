    RouterPrivateLinkConnectionCreateRequest:
      properties:
        availabilityZoneIds:
          description: AWS availability zone IDs, such as use1-az1, to place the endpoint
            in. Required on AWS data planes.
          items:
            type: string
          type:
          - array
          - "null"
        dataPlaneName:
          description: The data plane to restrict the connection to. Left out, the
            company's default data plane is used.
          type:
          - "null"
          - string
        environmentUUID:
          description: The environment to create it in. Ignored when the API key or
            MCP grant is scoped to one environment. Otherwise required for company-wide
            API keys and MCP grants; for other callers it defaults to the company's
            first environment.
          format: uuid
          type:
          - "null"
          - string
        name:
          description: A label to tell the connection apart in Artie, such as the
            database it reaches. On Azure it also appears in the connection request
            the service owner approves.
          type: string
        privateLinkServiceAlias:
          description: The Azure Private Link service alias to connect to. Required
            on Azure data planes.
          type: string
        vpcServiceName:
          description: The AWS VPC endpoint service name to connect to, as com.amazonaws.vpce.<region>.vpce-svc-<id>.
            Required on AWS data planes.
          type: string
      type: object
    RouterPrivateLinkConnectionUpdateRequest:
      properties:
        availabilityZoneIds:
          description: 'AWS availability zone IDs, such as use1-az1, to place the
            endpoint in. Only read while the connection is under review or errored
            with no endpoint: then an AWS update must resend them, even unchanged,
            from private_link_connection_detail. Otherwise ignored.'
          items:
            type: string
          type:
          - array
          - "null"
        dataPlaneName:
          description: The data plane to restrict the connection to; left out means
            the company's default. Only applied while the connection is under review
            or errored with no endpoint.
          type:
          - "null"
          - string
        name:
          description: New display name for the connection. Always editable.
          type: string
        privateLinkServiceAlias:
          description: 'The alias of the Azure Private Link service to connect to,
            which the service''s owner shares. Only read while the connection is under
            review or errored with no endpoint: then an Azure update must resend it,
            even unchanged, from private_link_connection_detail. Otherwise ignored.'
          type: string
        vpcServiceName:
          description: 'The AWS VPC endpoint service name, as com.amazonaws.vpce.<region>.vpce-svc-<id>.
            Only read while the connection is under review or errored with no endpoint:
            then an AWS update must resend it, even unchanged, from private_link_connection_detail.
            Otherwise ignored.'
          type: string
      required:
      - name
      type: object
    RouterQueryResult:
      properties:
        data:
          $ref: '#/components/schemas/RouterAnalyticsDatasetData'
          description: The dataset's scalar or timeseries values. Null when err is
            set.
        err:
          description: Why the query failed. Null on success.
          type:
          - "null"
          - string
        unit:
          $ref: '#/components/schemas/PayloadsAnalyticsUnit'
          description: The unit of the values in data.
      required:
      - unit
      - data
      - err
      type: object
    RouterRenameKafkaClusterRequest:
      properties:
        name:
          description: The cluster's new name, as customers see it. 3 to 100 characters.
          maxLength: 100
          minLength: 3
          type: string
      required:
      - name
      type: object
    RouterSSHTunnelCreateRequest:
      properties:
        environmentUUID:
          description: The environment to create it in. Ignored when the API key or
            MCP grant is scoped to one environment. Otherwise required for company-wide
            API keys and MCP grants; for other callers it defaults to the company's
            first environment.
          format: uuid
          type:
          - "null"
          - string
        host:
          description: Public hostname or IP address of the SSH bastion server.
          type: string
        name:
          description: A label to tell the tunnel apart in Artie, such as the bastion
            or network it reaches. Not sent to the bastion.
          type: string
        port:
          description: Port the SSH bastion server listens on.
          type: integer
        username:
          description: The bastion user Artie logs in as with the tunnel's generated
            key.
          type: string
      required:
      - host
      - port
      - username
      type: object
    RouterSSHTunnelUpdateRequest:
      properties:
        host:
          description: Public hostname or IP address of the SSH bastion server.
          type: string
        name:
          description: New display name for the tunnel.
          type: string
        port:
          description: Port the SSH bastion server listens on.
          type: integer
        username:
          description: The bastion user Artie logs in as. Empty keeps the saved username.
          type: string
      required:
      - name
      - host
      - port
      - username
      type: object
    RouterSnowflakeEcoScheduleCreateRequest:
      properties:
        environmentUUID:
          description: The environment to create it in. Ignored when the API key or
            MCP grant is scoped to one environment. Otherwise required for company-wide
            API keys and MCP grants; for other callers it defaults to the company's
            first environment.
          format: uuid
          type:
          - "null"
          - string
        name:
          description: Display name for the schedule.
          type: string
        settings:
          $ref: '#/components/schemas/PayloadsSnowflakeEcoScheduleSettings'
          description: Peak hours and the flush rules used outside them.
      required:
      - name
      - settings
