  /pipelines/{uuid}/automatic-schema-changes:
    post:
      description: Enqueues automatic schema changes for one eligible pipeline. Set
        forceRefresh to bypass the two-hour cooldown for this execution. The request
        is accepted before reconciliation completes.
      operationId: pipeline_trigger_automatic_schema_changes
      parameters:
      - description: The UUID of the pipeline, as returned by its list or create endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the pipeline, as returned by its list or create
            endpoint.
          type: string
      - description: When true, runs even if the pipeline's schema changes were checked
          in the last two hours.
        in: query
        name: forceRefresh
        schema:
          description: When true, runs even if the pipeline's schema changes were
            checked in the last two hours.
          type: boolean
      responses:
        "202":
          description: Accepted
        "404":
          description: Not Found
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Trigger automatic schema changes for a pipeline
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_trigger_automatic_schema_changes
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: safe-after-state-check
        title: Trigger automatic schema changes for a pipeline
        triggerDescription: 'Queues a job that brings one running pipeline''s destination
          tables in line with the source: it adds columns the source has and the destination
          lacks, drops columns deleted from the source when advancedSettings.dropDeletedColumns
          is on (irreversible), and emails a summary of the DDL it ran. Confirm with
          the user first. Runs at most once every two hours per pipeline unless forceRefresh
          is true. Returns 202 once queued, not when the DDL finishes, and 409 if
          the pipeline isn''t running, is locked, or the company hasn''t enabled automatic
          schema changes. For every eligible pipeline at once, use company_trigger_automatic_schema_changes.'
  /pipelines/{uuid}/backfill:
    post:
      description: 'Triggers a backfill for the given tables in the pipeline and redeploys
        it. beforeBackfill sets what happens to the destination table first: the empty
        string keeps its rows, truncate_table empties it, drop_table drops it, and
        swap_table rebuilds the table on the side and swaps it in once the backfill
        finishes. swap_table must be enabled for the company, works only on Snowflake
        and Databricks destinations, and can''t be used for history tables. keepOldTable,
        with swap_table only, keeps the old rows in a separate table until the next
        swap_table backfill of that table. backfillFromSchemas and backfillFromDatabases
        narrow a regular-table backfill and need the empty-string option. A Kafka
        destination only accepts the empty-string option. backfillBatchSize and backfillDefaults
        set the backfill speed and are saved on the pipeline''s source reader before
        the backfill starts, so later backfills use them too; a shared source reader
        rejects them.'
      operationId: pipeline_backfill_tables
      parameters:
      - description: The UUID of the pipeline, as returned by its list or create endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the pipeline, as returned by its list or create
            endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineBackfillRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: Backfill pipeline tables
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_backfill_tables
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: unsafe
        title: Backfill pipeline tables
        triggerDescription: Re-reads whole tables from the source into the destination
          and redeploys the pipeline. Pass table UUIDs from pipeline_detail (not connector_fetch_tables)
          of tables already on the running pipeline; to attach tables, use pipeline_update.
          beforeBackfill can truncate, drop, or rebuild-and-swap the destination tables
          first, which deletes their current rows, so confirm with the user. Returns
          204 once queued; 400 if no listed table could start (not found, already
          backfilling, or replication disabled); 429 past 2,500 tables per company
          per hour. backfillBatchSize and backfillDefaults are saved on the pipeline
          for later backfills too, and are rejected when the source reader is shared.
  /pipelines/{uuid}/backfill/cancel:
    post:
      description: Cancels backfilling for the given table UUIDs and/or history table
        UUIDs.
      operationId: pipeline_cancel_backfill_tables
      parameters:
      - description: The UUID of the pipeline, as returned by its list or create endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the pipeline, as returned by its list or create
