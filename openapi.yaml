      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_update_status
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
