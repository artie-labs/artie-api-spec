        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: source_reader_validate_unsaved
        outputSensitivity: none
        readOnlyHint: true
        remediation: Validate source-reader credentials through the authenticated
          Dashboard setup flow.
        requiredScopes:
        - source_readers:write
        retrySemantics: safe
        title: Validate an unsaved source reader
        triggerDescription: Use when you need to validate an unsaved source reader.
  /ssh-tunnels:
    post:
      description: Creates a new SSH tunnel for the authenticated company.
      operationId: ssh_tunnel_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterSSHTunnelCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSSHTunnel'
          description: OK
        "400":
          description: Bad Request
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      summary: Create an SSH tunnel
      tags:
      - SSH tunnels
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: ssh_tunnel_create
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - ssh_tunnels:write
        retrySemantics: unsafe
        title: Create an SSH tunnel
        triggerDescription: Creates an SSH tunnel record with a new key pair and returns
          it, including the publicKey the user must add to the bastion host's authorized_keys
          before connectors can use it. A company can have at most 100 tunnels. Keep
          the returned UUID; there is no list tool. The result also has the tunnel's
          uuid, name, host, port, username and environmentUUID.
  /ssh-tunnels/{uuid}:
    delete:
      description: Permanently deletes an SSH tunnel by UUID. The tunnel must not
        be in use by any connectors before it can be deleted.
      operationId: ssh_tunnel_delete
      parameters:
      - description: The UUID of the SSH tunnel, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the SSH tunnel, as returned by its list or create
            endpoint.
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete an SSH tunnel
      tags:
      - SSH tunnels
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: ssh_tunnel_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - ssh_tunnels:delete
        retrySemantics: safe-after-state-check
        title: Delete an SSH tunnel
        triggerDescription: Deletes an SSH tunnel. Returns 400 naming the connectors
          that still use it (ssh_tunnel_detail isInUse shows whether any do). The
          uuid is a connector's sshTunnelUUID from connector_detail or the one ssh_tunnel_create
          returned.
    get:
      description: Retrieves the details of an SSH tunnel by UUID, including its host,
        port, username, public key, and whether it is currently in use.
      operationId: ssh_tunnel_detail
      parameters:
      - description: The UUID of the SSH tunnel, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the SSH tunnel, as returned by its list or create
            endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSSHTunnel'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get an SSH tunnel
      tags:
      - SSH tunnels
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: ssh_tunnel_detail
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - ssh_tunnels:read
        retrySemantics: safe
        title: Get an SSH tunnel
        triggerDescription: 'Returns an SSH tunnel''s host, port, username, publicKey
          (to add to the bastion''s authorized_keys) and isInUse; never a private
          key. There is no list tool: the uuid is a connector''s sshTunnelUUID from
          connector_list or connector_detail, or the one ssh_tunnel_create returned.'
    post:
      description: Updates an existing SSH tunnel by UUID. You can modify the name,
        host, port, and username. Changes will mark associated pipelines as having
        undeployed changes.
      operationId: ssh_tunnel_update
      parameters:
      - description: The UUID of the SSH tunnel, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the SSH tunnel, as returned by its list or create
            endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterSSHTunnelUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSSHTunnel'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update an SSH tunnel
      tags:
      - SSH tunnels
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: ssh_tunnel_update
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - ssh_tunnels:write
        retrySemantics: unsafe
        title: Update an SSH tunnel
        triggerDescription: Replaces an SSH tunnel's name, host, and port, and its
          username when one is sent (an empty username keeps the saved one), then
          returns the tunnel. Send every field, starting from ssh_tunnel_detail. The
          key pair doesn't change, so the bastion's authorized_keys entry stays valid.
          Every pipeline whose connectors use the tunnel is marked as having undeployed
          changes and needs a redeploy to pick up the change.
