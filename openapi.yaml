          status and backfill table UUIDs. sourceReaderUUID is the uuid for source_reader_detail
          and source_reader_update, not a connector uuid. This is not lag (pipeline_usage)
          or error logs (pipeline_error_logs). Omit includeRelatedObjects — that Dashboard
          flag wraps connectors and is not this tool''s success shape.'
    post:
      description: 'Full replace of an existing pipeline by UUID. Omitted fields are
        written as zero values: missing dataPlaneName 400s, missing tables deletes
        every table. Clients must echo the last FullPipeline and change only the intended
        fields.'
      operationId: pipeline_update
      parameters:
