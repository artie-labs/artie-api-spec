          $ref: '#/components/schemas/PayloadsConnectorPayload'
        destinationUUID:
          format: uuid
          type:
          - "null"
          - string
        pipelineUUID:
          format: uuid
          type:
          - "null"
          - string
        sourceReaderUUID:
