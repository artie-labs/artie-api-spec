openapi: 3.1.0
info:
  description: External API endpoints for Artie
  title: Artie API
  version: v1.0.247
servers:
- url: https://api.artie.com
paths:
  /analytics:
    get:
      description: Queries Datadog metrics for analytics datasets such as rows synced,
        ingestion lag, flush time, and more. pipelineUUID is required for API keys
        bound to an environment. For windows of 59 minutes or longer, from and to
        are floored to 30 s and results are cached for up to 1 minute.
      operationId: analytics_query
      parameters:
      - description: Start of the time window, in RFC 3339.
        in: query
        name: from
        required: true
        schema:
          description: Start of the time window, in RFC 3339.
          type: string
      - description: End of the time window, in RFC 3339. Keep the window between
          1 second and 15 months long, starting no later than now.
        in: query
        name: to
        required: true
        schema:
          description: End of the time window, in RFC 3339. Keep the window between
            1 second and 15 months long, starting no later than now.
          type: string
      - description: Datasets to return, such as rowsSyncedByTime, ingestionLag or
          rowLag; repeat the parameter for each. Unknown names are ignored.
        in: query
        name: datasets[]
        required: true
        schema:
          description: Datasets to return, such as rowsSyncedByTime, ingestionLag
            or rowLag; repeat the parameter for each. Unknown names are ignored.
          items:
            type: string
          type: array
      - description: UUID of the pipeline to include, from pipeline_list; left out,
          metrics cover every pipeline in the company. Required for environment-scoped
          API keys.
        in: query
        name: pipelineUUID
        schema:
          description: UUID of the pipeline to include, from pipeline_list; left out,
            metrics cover every pipeline in the company. Required for environment-scoped
            API keys.
          type: string
      - description: Only include these table names; repeat the parameter for each.
        in: query
        name: tables[]
        schema:
          description: Only include these table names; repeat the parameter for each.
          items:
            type: string
          type: array
      - description: exclude leaves out rows written by backfills, only keeps just
          those rows, and empty includes both.
        in: query
        name: backfillOptions
        schema:
          description: exclude leaves out rows written by backfills, only keeps just
            those rows, and empty includes both.
          type: string
      - description: replication or history to only count rows Transfer wrote in that
          mode; empty includes both.
        in: query
        name: transferMode
        schema:
          description: replication or history to only count rows Transfer wrote in
            that mode; empty includes both.
          type: string
      - description: pipeline or table to return one series per pipeline or table;
          empty returns one series per dataset.
        in: query
        name: groupBy
        schema:
          description: pipeline or table to return one series per pipeline or table;
            empty returns one series per dataset.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterAnalyticsResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Query analytics data
      tags:
      - Analytics
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: analytics_query
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - pipelines:read
        retrySemantics: safe
        title: Query analytics
        triggerDescription: Returns time series for named datasets (datasets[]) such
          as rowsSyncedByTime, ingestionLag, readerLag, rowLag and flushTime over
          from/to (RFC3339). Pass pipelineUUID from pipeline_list to scope to one
          pipeline; it is required for environment-scoped keys. Total lag is readerLag
          plus ingestionLag at each timestamp. Use for lag or throughput over time.
          For one per-table lag number and row count, use pipeline_usage.
  /column-hashing-salts:
    get:
      description: Lists all column hashing salts for the authenticated company.
      operationId: column_hashing_salt_list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyColumnHashingSalt'
          description: OK
        "500":
          description: Internal Server Error
      summary: List column hashing salts
      tags:
      - Column hashing salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_list
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: List column hashing salts
        triggerDescription: Lists the company's column hashing salts (uuid, name,
          description; never the salt). A pipeline uses the one in its columnHashingSaltUUID
          (pipeline_detail) to hash the columnsToHash in each table's advancedSettings.
          Use a uuid here for column_hashing_salt_preview, _update or _delete.
    post:
      description: Creates a new column hashing salt for the authenticated company.
      operationId: column_hashing_salt_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterCreateColumnHashingSaltRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterCreateColumnHashingSaltResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a column hashing salt
      tags:
      - Column hashing salts
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts and returns a column-hashing salt.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: column_hashing_salt_create
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Create column-hashing salts through the authenticated Dashboard
          setup flow.
        requiredScopes:
        - column_hashing_salts:write
        retrySemantics: unsafe
        title: Create a column hashing salt
        triggerDescription: Use when you need to create a column hashing salt.
  /column-hashing-salts/{uuid}:
    delete:
      description: Deletes a column hashing salt by UUID.
      operationId: column_hashing_salt_delete
      parameters:
      - description: The UUID of the column hashing salt, as returned by its list
          or create endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the column hashing salt, as returned by its list
            or create endpoint.
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a column hashing salt
      tags:
      - Column hashing salts
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - column_hashing_salts:delete
        retrySemantics: safe-after-state-check
        title: Delete a column hashing salt
        triggerDescription: Permanently deletes a column hashing salt. Returns 400
          naming the pipelines that still use it; switch them to another salt first.
          Values already hashed with it stay hashed. The uuid comes from column_hashing_salt_list.
    get:
      description: Retrieves a column hashing salt by UUID, including the decrypted
        salt. Requires company admin.
      operationId: column_hashing_salt_detail
      parameters:
      - description: The UUID of the column hashing salt, as returned by its list
          or create endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the column hashing salt, as returned by its list
            or create endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsColumnHashingSaltDetail'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get a column hashing salt
      tags:
      - Column hashing salts
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Returns the decrypted column-hashing salt.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_detail
        outputSensitivity: restricted-credentials
        readOnlyHint: true
        remediation: Use column_hashing_salt_list for non-secret salt references.
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: Get a column hashing salt
        triggerDescription: Use when you need to get a column hashing salt.
    post:
      description: Updates the name and description of a column hashing salt.
      operationId: column_hashing_salt_update
      parameters:
      - description: The UUID of the column hashing salt, as returned by its list
          or create endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the column hashing salt, as returned by its list
            or create endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterUpdateColumnHashingSaltRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsColumnHashingSalt'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a column hashing salt
      tags:
      - Column hashing salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_update
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - column_hashing_salts:write
        retrySemantics: unsafe
        title: Update a column hashing salt
        triggerDescription: Replaces a column hashing salt's name and description;
          send both, since a missing one is blanked. The secret stays the same, so
          values pipelines already hashed don't change. There is no tool to rotate
          or create a salt. The uuid comes from column_hashing_salt_list.
  /column-hashing-salts/{uuid}/preview:
    post:
      description: Hashes a sample string value with this salt using the same function
        used by Artie's pipelines (HMAC-SHA256 keyed on the salt, or SHA-256 if the
        salt is empty). Returns the hex-encoded hash.
      operationId: column_hashing_salt_preview
      parameters:
      - description: The UUID of the column hashing salt, as returned by its list
          or create endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the column hashing salt, as returned by its list
            or create endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPreviewColumnHashingSaltRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPreviewColumnHashingSaltResponse'
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Preview a column hashing salt
      tags:
      - Column hashing salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_preview
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: Hash a value with a column hashing salt
        triggerDescription: Hashes a sample value the way pipelines do (HMAC-SHA256
          keyed on the salt, or SHA-256 if the salt is empty) and returns the hex
          digest, without revealing the salt. Use it to check which salt produced
          a hashed value or to get the hash to look a row up by. The uuid comes from
          column_hashing_salt_list.
  /company/automatic-schema-changes:
    post:
      description: Enqueues automatic schema changes for all eligible running pipelines
        in the authenticated company. The request is accepted before reconciliation
        completes.
      operationId: company_trigger_automatic_schema_changes
      responses:
        "202":
          description: Accepted
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: Trigger automatic schema changes for all pipelines
      tags:
      - Company
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: company_trigger_automatic_schema_changes
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: safe-after-state-check
        title: Trigger automatic schema changes for a company
        triggerDescription: 'Queues the automatic schema change job for every running,
          unlocked pipeline in the company (or in the current environment): each adds
          columns the source has and the destination lacks, drops columns deleted
          from the source on pipelines with advancedSettings.dropDeletedColumns on
          (irreversible), and emails a summary. Confirm with the user first. A pipeline
          whose job ran or that was deployed in the last two hours is skipped silently,
          and the call still returns 202. Returns 403 if the company hasn''t enabled
          automatic schema changes. For one pipeline, or to skip the two-hour wait,
          use pipeline_trigger_automatic_schema_changes.'
  /connectors:
    get:
      description: Returns all destination connectors for the authenticated company.
        Pass includeSourceConnectors=true to also include source connectors.
      operationId: connector_list
      parameters:
      - description: Set to true to list every connector, sources included. By default
          only destination connectors are listed.
        in: query
        name: includeSourceConnectors
        schema:
          description: Set to true to list every connector, sources included. By default
            only destination connectors are listed.
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyLightConnector'
          description: OK
        "500":
          description: Internal Server Error
      summary: List connectors
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_list
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: List connectors
        triggerDescription: Lists saved connectors. Defaults to destinations; pass
          includeSourceConnectors=true for sources. Call this before connector_fetch_databases,
          connector_fetch_schemas, connector_fetch_tables, or connector_fetch_table_detail
          — those tools need a uuid from this list, not a pipeline uuid or sourceReaderUUID
          from pipeline_list.
    post:
      description: Creates a new source or destination connector for your Artie deployment.
        Configure database connections, authentication, and replication settings programmatically.
      operationId: connector_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: connector_create
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Create a connector
        triggerDescription: 'Creates a saved source or destination connector. Pass
          type, label, and sharedConfig (host, user, password, and type-specific fields).
          Keep the returned UUID for pipeline_create_from_source. To copy a saved
          connector in the same environment, pass its uuid with the sharedConfig from
          connector_detail: masked secrets (********) are filled in from it, so don''t
          ask the user for them.'
  /connectors/{uuid}:
    delete:
      description: Permanently removes a connector and its associated configuration.
        This stops any active replication pipelines that depend on the connector.
      operationId: connector_delete
      parameters:
      - description: The UUID of the connector, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the connector, as returned by its list or create
            endpoint.
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - connectors:delete
        retrySemantics: safe-after-state-check
        title: Delete a connector
        triggerDescription: Permanently deletes a saved connector by UUID and stops
          pipelines that depend on it.
    get:
      description: Retrieves the full configuration of a saved connector by uuid from
        connector_list, including type, label, and sharedConfig. Sensitive fields
        may be masked.
      operationId: connector_detail
      parameters:
      - description: The UUID of the connector, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the connector, as returned by its list or create
            endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_detail
        outputSensitivity: restricted-credentials
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Get a saved connector
        triggerDescription: Returns a saved connector by uuid from connector_list,
          not a pipeline uuid or sourceReaderUUID. Includes type, label, and sharedConfig.
          Sensitive fields may be masked placeholders. With connectors:write, you
          can ping that connector by passing this payload into unsaved_connector_ping
          with uuid set so stored secrets unmask.
    post:
      description: Updates the configuration of an existing source or destination
        connector. Modify connection settings, credentials, or replication parameters
        for a running pipeline.
      operationId: connector_update
      parameters:
      - description: The UUID of the connector, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the connector, as returned by its list or create
            endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts and returns connector configuration that can contain
          credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: connector_update
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Update connector credentials through the authenticated Dashboard
          setup flow.
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Update a connector
        triggerDescription: Use when you need to update a connector.
  /connectors/{uuid}/databases:
    get:
      description: Lists available databases on the target using a saved connector's
        configuration. Response metadata may include Iceberg S3 table bucket maintenance
        defaults.
      operationId: connector_fetch_databases
      parameters:
      - description: The UUID of the connector, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the connector, as returned by its list or create
            endpoint.
          type: string
      - description: Database to connect to. Defaults to the connector's defaultDatabase.
        in: query
        name: databaseName
        schema:
          description: Database to connect to. Defaults to the connector's defaultDatabase.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorFetchDatabasesResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch databases for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_databases
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch databases for a saved connector
        triggerDescription: Lists database names a saved source can see. uuid must
          come from connector_list with includeSourceConnectors=true. Do not pass
          a pipeline uuid or sourceReaderUUID. Returns items with each database's
          name, plus metadata for catalogs that have catalog-level properties, such
          as an Iceberg S3 Tables bucket.
  /connectors/{uuid}/detail:
    get:
      description: Returns detailed metadata for a specific table on the saved connector.
        tableName is required; databaseName defaults to the connector's configured
        database, schemaName defaults to the connector type's default schema, and
        isView is optional.
      operationId: connector_fetch_table_detail
      parameters:
      - description: The UUID of the connector, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the connector, as returned by its list or create
            endpoint.
          type: string
      - description: Database to connect to. Defaults to the connector's defaultDatabase.
        in: query
        name: databaseName
        schema:
          description: Database to connect to. Defaults to the connector's defaultDatabase.
          type: string
      - description: The table's schema, from connector_fetch_schemas. Defaults to
          the connector type's default schema, such as public for Postgres.
        in: query
        name: schemaName
        schema:
          description: The table's schema, from connector_fetch_schemas. Defaults
            to the connector type's default schema, such as public for Postgres.
          type: string
      - description: The table name, from connector_fetch_tables.
        in: query
        name: tableName
        required: true
        schema:
          description: The table name, from connector_fetch_tables.
          type: string
      - description: Set to true when the object is a view (isView in connector_fetch_tables).
        in: query
        name: isView
        schema:
          description: Set to true when the object is a view (isView in connector_fetch_tables).
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorTableDetailResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch table detail for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_table_detail
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch table detail for a saved connector
        triggerDescription: Returns columns and metadata for one table on a saved
          connector. uuid must come from connector_list (includeSourceConnectors=true
          for sources). Do not pass a pipeline uuid or sourceReaderUUID. tableName
          is required. This is column metadata, not pipeline lag or row counts.
  /connectors/{uuid}/generate-shadow-script:
    post:
      description: Generates the SQL script to create shadow tables required for Oracle
        change data capture (CDC). Run this script on your Oracle source before starting
        replication.
      operationId: connector_generate_shadow_script
      parameters:
      - description: The UUID of the connector, as returned by its list or create
          endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the connector, as returned by its list or create
            endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorGenerateShadowScriptRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorGenerateShadowScriptResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Generate Oracle shadow table script
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_generate_shadow_script
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Generate Oracle shadow table script
        triggerDescription: Returns a SQL script for the user to run on a saved Oracle
          source. The script creates a locked SHADOW user, a shadow table per source
          table, grants, and AFTER triggers on the source tables that copy changes
          into the shadow tables. The tool itself changes nothing. Pass up to 10 tables
          with their columns (from connector_fetch_table_detail); a table without
          columns returns 400. Oracle sources only. The result's script field holds
          the SQL text.
  /connectors/{uuid}/postgres-drop-replication-slot:
    post:
      description: Drops a PostgreSQL replication slot that is inactive or orphaned.
