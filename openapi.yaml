    RouterSnowflakeEcoScheduleUpdateRequest:
      properties:
        name:
          description: New display name for the schedule.
          type: string
        settings:
          $ref: '#/components/schemas/PayloadsSnowflakeEcoScheduleSettings'
          description: The full new settings; they replace the old ones.
      required:
      - name
      - settings
      type: object
    RouterSourceReaderCreateRequest:
      properties:
        archiveConnectorUUID:
          format: uuid
          type:
          - "null"
          - string
        connectorUUID:
          format: uuid
          type: string
        containerName:
          type: string
        dataPlaneName:
          type: string
        database:
          type: string
        isShared:
          type: boolean
        name:
          type: string
        settings:
          $ref: '#/components/schemas/PayloadsSourceReaderSettingsPayload'
        tablesConfig:
          $ref: '#/components/schemas/PayloadsSourceReaderTablesConfig'
      required:
      - connectorUUID
      type: object
    RouterSourceReaderUpdateStatusRequest:
      properties:
        status:
          $ref: '#/components/schemas/EnumsSourceReaderStatus'
          description: running or paused. Pausing a shared source reader stops reading
            for every pipeline on it.
      required:
      - status
      type: object
    RouterSourceReaderValidateUnsavedRequest:
      properties:
        sourceReader:
          $ref: '#/components/schemas/PayloadsSourceReader'
      required:
      - sourceReader
      type: object
    RouterSourceReaderValidateUnsavedResponse:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    RouterUpdateColumnHashingSaltRequest:
      properties:
        description:
          description: New notes for the salt. Left empty, the notes are cleared.
          type: string
        name:
          description: New display name for the salt.
          type: string
      required:
      - name
      type: object
    RouterUpdateEncryptionKeyRequest:
      properties:
        description:
          description: New notes for the key. Left empty, the notes are cleared.
          type: string
        name:
          description: New display name for the key.
          type: string
      required:
      - name
      type: object
    RouterUpdateIngestionAPIKeyRequest:
      properties:
        expiresAt:
          description: When the key stops working, as a future time. Null or left
            out removes the expiry. Ignored once the key has expired.
          format: date-time
          type:
          - "null"
          - string
        name:
          description: New display name for the key. Left empty, the name is cleared.
          type: string
      type: object
    RouterUpdateKafkaClusterAllowedCIDRsRequest:
      properties:
        allowedCIDRs:
          description: Client IPv4 ranges allowed to reach the cluster. Replaces the
            current list. Empty allows any IP; clients still need the password.
          items:
            type: string
          type: array
      required:
      - allowedCIDRs
      type: object
    RouterUpdateKafkaClusterBrokerSettingsRequest:
      properties:
        retentionMS:
          description: 'How long topics keep messages unless they set their own retention.ms,
            in ms (log.retention.ms): at least 86400000 (one day), or -1 to keep messages
            forever. It can''t be shorter than days on disk. Consumer offsets retention
            follows it, which restarts the brokers one at a time.'
          type:
          - "null"
          - integer
      type: object
    RouterUpdateKafkaClusterBrokersRequest:
      properties:
        brokers:
          description: New number of brokers. Brokers can only be added for now. The
            count the cluster already has is left as it is. Existing partitions stay
            on the brokers they're on; new topics use every broker.
          maximum: 30
          minimum: 3
          type: integer
      required:
      - brokers
      type: object
    RouterUpdateKafkaClusterInstanceTypeRequest:
      properties:
        instanceType:
          $ref: '#/components/schemas/PayloadsKafkaInstanceType'
          description: EC2 instance type for every broker. The brokers restart one
            at a time onto the new machines. The type they already run is left as
            it is.
      required:
      - instanceType
      type: object
    RouterUpdateKafkaClusterRequest:
      properties:
        allowedCIDRs:
          description: Client IPv4 ranges allowed to reach the cluster. Replaces the
            current list. Empty allows any IP; clients still need the password. No
            broker restarts.
          items:
            type: string
          type: array
        brokers:
          description: New number of brokers. Brokers can only be added. The count
            the cluster already has is left as it is. Existing partitions stay where
            they are; new topics use every broker.
          maximum: 30
          minimum: 3
          type:
          - "null"
          - integer
        instanceType:
          $ref: '#/components/schemas/PayloadsKafkaInstanceType'
          description: EC2 instance type for every broker. The brokers restart one
            at a time onto new machines. The type they already run is left as it is.
        name:
          description: The cluster's name, as customers see it. Also works on a cluster
            on the company's BYOC data plane. The bootstrap address and Kubernetes
            objects keep the name it was created with.
          maxLength: 100
          minLength: 3
          type:
          - "null"
          - string
        storageAutoscale:
          $ref: '#/components/schemas/PayloadsKafkaClusterStorageAutoscale'
          description: How Artie grows the brokers' disks before they fill. Replaces
            the current settings. Takes effect on the next autoscale run; nothing
            is applied to the cluster.
        storageGiB:
          description: 'New disk per broker in GiB: 50 or 80, or any size from 100
            to 1024 (1 TiB). A larger size grows the disks online; the size the brokers
            already have is left as it is. AWS limits how often a disk can change,
            so storage grows at most 3 times in 24 hours (429 otherwise).'
          maximum: 1024
          minimum: 50
          type:
          - "null"
          - integer
        tieredStorage:
          $ref: '#/components/schemas/RouterUpdateKafkaClusterTieredStorageRequest'
          description: Whether every topic is tiered, days on disk, and disk cap per
            partition. Replaces the current settings. New days on disk or a new cap
            applies to the running brokers without a restart.
      type: object
    RouterUpdateKafkaClusterStorageRequest:
      properties:
        storageGiB:
          description: 'New disk per broker in GiB: 50 or 80, or any size from 100
            to 1024 (1 TiB). A larger size grows the disks; the size the brokers already
            have is left as it is. Bigger sizes go through support.'
          maximum: 1024
          minimum: 50
          type: integer
      required:
      - storageGiB
      type: object
    RouterUpdateKafkaClusterTieredStorageRequest:
      properties:
        localRetentionBytes:
          description: 'Disk cap per partition: the most broker disk each partition
            of a tiered topic keeps, in bytes, at least 1073741824 (1 GiB). Null is
            no cap.'
          minimum: 1.073741824e+09
          type:
          - "null"
          - integer
        localRetentionMS:
          description: 'Days on disk: how long tiered topics keep data on broker disks,
            in ms, from 86400000 (one day) to 2592000000 (30 days), and no longer
            than the cluster''s retention.'
          format: int64
          maximum: 2.592e+09
          minimum: 8.64e+07
          type: integer
        tierAllTopics:
          description: 'Whether every topic is tiered. It wins over each topic''s
            own choice: turning it on turns tiered storage on for every topic, and
            turning it off pauses every topic tiered through Artie (one tiered outside
            Artie, e.g. with the CLI, is left alone). A paused topic keeps new messages
            on broker disks while what''s already in remote storage stays readable
            until retention expires it.'
          type: boolean
      required:
      - tierAllTopics
      - localRetentionMS
      type: object
    RouterUpdateKafkaTopicRetentionRequest:
      properties:
        retentionMS:
          description: 'New retention.ms: at least 86400000 (one day), or -1 to keep
            messages forever.'
          type: integer
      required:
      - retentionMS
      type: object
    RouterUpdateKafkaTopicSettingsRequest:
      properties:
        localRetentionMS:
          description: 'How long the tiered topic keeps data on broker disks: from
            86400000 (one day) up to retention. Turning tiered storage on without
            it uses 7 days, capped at retention; on a Managed Kafka cluster it uses
            the cluster''s days on disk.'
          type:
          - "null"
          - integer
        retentionMS:
          description: 'New retention.ms: at least 86400000 (one day); or -1 to keep
            messages forever.'
          type:
          - "null"
          - integer
        tieredStorage:
          description: Whether old segments move to remote storage. A topic that's
            on can only be paused, and only a paused topic can be turned off, which
            deletes its data in remote storage. Pausing keeps that data readable until
            retention expires it.
          enum:
          - "off"
          - "on"
          - paused
          - null
          type:
          - "null"
          - string
      type: object
    RouterValidateErrorResponse:
      properties:
        error:
          type: string
      type: object
  securitySchemes:
    ApiKey:
      description: API key passed as a Bearer token in the Authorization header.
      scheme: bearer
      type: http
security:
- ApiKey: []
