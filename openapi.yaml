            the credentials endpoint.
          type: string
        user:
          $ref: '#/components/schemas/PayloadsManagedKafkaUser'
          description: The user.
        warning:
          description: Set when the password isn't live yet, so it's left out.
          type: string
      required:
      - user
      type: object
    RouterPipelineBackfillRequest:
      properties:
        backfillBatchSize:
          description: Optional rows per batch. Saved as the pipeline's backfill batch
            size before the backfill starts, so later backfills use it too.
          minimum: 0
          type:
          - "null"
          - integer
        backfillDefaults:
          $ref: '#/components/schemas/PayloadsBackfillDefaultsPayload'
          description: Optional backfill speed. Saved as the pipeline's backfill speed
            before the backfill starts, so later backfills use it too.
        backfillFromDatabases:
          description: Optional source databases to backfill for regular-table backfills.
            Requires beforeBackfill to be the empty-string do-nothing option.
          items:
            type: string
          type:
          - array
          - "null"
        backfillFromSchemas:
          description: Optional source schemas to backfill for regular-table backfills.
            Requires beforeBackfill to be the empty-string do-nothing option.
          items:
            type: string
          type:
          - array
          - "null"
        beforeBackfill:
          description: 'Destination handling before the backfill: empty string leaves
            existing data unchanged, truncate_table truncates the destination table,
            drop_table drops it, and swap_table rebuilds it on the side and swaps
            it in once the backfill finishes.'
          enum:
          - ""
          - truncate_table
          - drop_table
          - swap_table
          type: string
        historyMode:
          description: When true, backfill the selected history tables instead of
            the regular tables.
          type: boolean
        keepOldTable:
          description: 'Only for swap_table: keep the destination table''s old rows
            in a separate table after the swap, until the next swap_table backfill
            of this table.'
          type: boolean
        tableUUIDs:
          description: UUIDs of the tables to backfill, from tables[].uuid in pipeline_detail.
            With historyMode, the same table UUIDs select those tables' history tables.
          items:
            format: uuid
            type: string
          type: array
      required:
      - tableUUIDs
      - beforeBackfill
      type: object
    RouterPipelineCancelBackfillRequest:
      properties:
        historyTableUUIDs:
          description: UUIDs of the tables whose history-table backfill to cancel.
            These are the regular tables' UUIDs from tables[].uuid in pipeline_detail,
            not separate history table IDs.
          items:
            format: uuid
            type: string
          type: array
        optionalReason:
          description: Free-text reason for the cancel. Accepted but not stored or
            used; leave it out.
          type: string
        tableUUIDs:
          description: UUIDs of the tables whose regular-table backfill to cancel,
            from tables[].uuid in pipeline_detail.
          items:
            format: uuid
            type: string
          type: array
      required:
      - tableUUIDs
      - historyTableUUIDs
      type: object
    RouterPipelineCreateFromSourceRequest:
      properties:
        dataPlaneName:
          description: Data plane for the new pipeline; empty uses the company's default.
            With sourceReaderUUID, it must match the source reader's data plane.
          type: string
        database:
          description: Database name written onto the new source reader. Postgres,
            Cockroach, and Oracle need this before start; discover with connector_fetch_databases.
            Optional — the dashboard wizard creates without it.
          type: string
        destinationType:
          description: Optional destination type (e.g. snowflake). Creates a stub
            destination connector with empty credentials.
          type: string
        environmentUUID:
          description: Environment for a new stub connector. Used when sourceType
            is set; ignored when sourceConnectorUUID is set.
          format: uuid
          type:
          - "null"
          - string
        shareSourceReader:
          description: Create the draft's source reader as shared, so other pipelines
            can read from it later. Requires shared source readers to be enabled for
            the account.
          type: boolean
        sourceConnectorUUID:
          description: UUID of an existing source connector. Creates a dedicated reader
            and draft pipeline against that source.
          format: uuid
          type:
          - "null"
          - string
        sourceReaderUUID:
          description: UUID of a shared source reader for the draft to read from.
            No source reader is created. Can't be combined with sourceType or sourceConnectorUUID.
            Requires shared source readers to be enabled for the account.
          format: uuid
          type:
          - "null"
          - string
        sourceType:
          description: Source type to bootstrap (e.g. postgresql). Creates a stub
            connector with empty credentials. Prefer sourceConnectorUUID when the
            source already exists.
          type: string
      type: object
    RouterPipelineCreateRequest:
      properties:
        pipeline:
          $ref: '#/components/schemas/PayloadsPipelinePayload'
          description: The pipeline to create.
      required:
      - pipeline
      type: object
    RouterPipelineStartRequest:
      properties:
        disableBackFill:
          description: When true, new tables skip their initial backfill and start
            streaming.
          type: boolean
        keepPaused:
          description: When true, deploys a paused pipeline's changes without resuming
            it. Ignored when the pipeline isn't paused.
          type: boolean
      type: object
    RouterPipelineTableStats:
      properties:
