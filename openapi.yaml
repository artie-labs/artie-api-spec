      description: Changes the status of a pipeline (e.g. running, paused). Validates
        the pipeline before resuming and deploys the configuration change. Pausing
        a pipeline pauses its source reader, unless the source reader is shared and
        another pipeline still reads from it; resuming a pipeline resumes its source
        reader.
      operationId: pipeline_update_status
      parameters:
      - description: The UUID of the pipeline, as returned by its list or create endpoint.
        in: path
        name: uuid
