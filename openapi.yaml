          type: string
        warning:
          description: Set when the new password isn't live yet, so it's left out.
            Get it from the admin credentials in a few minutes.
          type: string
      type: object
    RouterKafkaClusterEstimate:
      properties:
        egressRates:
          description: The region's outbound transfer prices, not in the total.
          items:
            $ref: '#/components/schemas/RouterKafkaClusterEstimateEgressRate'
          type: array
        feeRate:
          description: Artie's fee on compute, e.g. 0.25.
          format: double
          type: number
        feeUSD:
          description: Artie's fee, in whole dollars a month.
          type: integer
        lineItems:
          description: The cost lines, which add up to totalUSD less feeUSD.
          items:
            $ref: '#/components/schemas/RouterKafkaClusterEstimateLineItem'
          type: array
        pricesAsOf:
          description: When the prices were last fetched from AWS; null before the
            first fetch.
          format: date-time
          type:
          - "null"
          - string
        region:
          description: The region priced.
          type: string
        totalUSD:
          description: The monthly total in whole dollars, fee included.
          type: integer
      required:
      - region
      - lineItems
      - feeRate
      - feeUSD
      - totalUSD
      - egressRates
      type: object
    RouterKafkaClusterEstimateEgress:
      properties:
        crossAZ:
          description: GiB a month to other availability zones in the region.
          format: double
          minimum: 0
          type: number
        crossRegion:
          additionalProperties:
            format: double
            type: number
          description: GiB a month to each other region, by region code.
          type:
          - object
          - "null"
        internet:
          description: Also traffic to other clouds.
          format: double
          minimum: 0
          type: number
        sameAZ:
          description: Billed like cross-AZ traffic, since clients connect through
            the cluster's public load balancer.
          format: double
          minimum: 0
          type: number
      type: object
    RouterKafkaClusterEstimateEgressRate:
      properties:
        label:
          description: The kind of outbound traffic.
          type: string
        maxUSDPerGB:
          description: The highest price per GiB, in dollars.
          format: double
          type: number
        minUSDPerGB:
          description: The lowest price per GiB, in dollars.
          format: double
          type: number
      required:
      - label
      - minUSDPerGB
      - maxUSDPerGB
      type: object
    RouterKafkaClusterEstimateLineItem:
      properties:
        category:
          description: The kind of cost.
          enum:
          - instance
          - block_storage
          - object_storage
          - data_transfer
          - network
          type: string
        label:
          description: What the line prices, for display.
          type: string
        quantity:
          description: How many units the month uses.
          format: double
          type: number
        unit:
          description: What quantity counts.
          enum:
          - hour
          - gb_month
          - gb
          - iops_month
          - mbps_month
          - request_1k
          type: string
        unitUSD:
          description: The first tier's price for a tiered one.
          format: double
          type: number
        usd:
          description: The line's monthly cost in whole dollars.
          type: integer
      required:
      - category
      - label
      - quantity
      - unit
      - unitUSD
      - usd
      type: object
    RouterKafkaClusterEstimateRequest:
      properties:
        brokers:
          description: How many brokers to price.
          maximum: 30
          minimum: 3
          type: integer
        instanceType:
          $ref: '#/components/schemas/PayloadsKafkaInstanceType'
          description: The instance type each broker runs on.
        region:
          description: Region code; defaults to the region Managed Kafka runs in.
          type: string
        storageGiBPerBroker:
          description: Disk per broker in GiB, with the same sizes create accepts.
          type: integer
        tieredStorageGiB:
          description: Data in tiered storage, uncompressed. Billed on that size at
            the S3 price.
          format: double
          minimum: 0
          type: number
        traffic:
          $ref: '#/components/schemas/RouterKafkaClusterEstimateTraffic'
