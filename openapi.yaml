  /pipelines/{uuid}/usage:
    get:
      description: Returns table-level usage statistics for the specified pipeline
        within a given time range. Requires 'from' and 'to' query parameters in RFC3339
        format. Pass 'excludeBackfills=true' to exclude backfill rows from row counts.
      operationId: pipeline_usage
      parameters:
      - description: The UUID of the pipeline, as returned by its list or create endpoint.
        in: path
        name: uuid
        required: true
        schema:
          description: The UUID of the pipeline, as returned by its list or create
            endpoint.
          type: string
      - description: Start of the time window.
        in: query
        name: from
        required: true
        schema:
          description: Start of the time window.
          format: date-time
          type: string
      - description: End of the time window. Keep the window between 1 second and
          15 months long, starting no later than now.
        in: query
        name: to
        required: true
        schema:
          description: End of the time window. Keep the window between 1 second and
            15 months long, starting no later than now.
          format: date-time
          type: string
      - description: When true, rows processed by backfills are excluded from row
          counts so only CDC rows are counted. Latency is not affected. Defaults to
          false.
        in: query
        name: excludeBackfills
        schema:
          description: When true, rows processed by backfills are excluded from row
            counts so only CDC rows are counted. Latency is not affected. Defaults
            to false.
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPipelineUsageResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
        "502":
          description: Bad Gateway
      summary: Get pipeline usage
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_usage
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - pipelines:read
        retrySemantics: safe
        title: Get pipeline usage
        triggerDescription: 'Returns one ingestion lag (latency) and row count per
          table for a saved pipeline (uuid from pipeline_list) over from and to (RFC3339);
          set excludeBackfills=true to count only CDC rows. Its lag is ingestion lag
          only: for lag over time, or total lag (readerLag plus ingestionLag), use
          analytics_query. This is not slot health, warehouse correctness, table status
          (pipeline_detail) or error logs (pipeline_error_logs).'
