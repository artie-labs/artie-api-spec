          description: The UUID of the pipeline, as returned by its list or create
            endpoint.
          type: string
      - description: When true, the response also carries the source reader and connectors.
          MCP clients must leave it out.
        in: query
        name: includeRelatedObjects
        schema:
          description: When true, the response also carries the source reader and
            connectors. MCP clients must leave it out.
