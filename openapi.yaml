openapi: 3.1.0
info:
  description: External API endpoints for Artie
  title: Artie API
  version: v1.0.83
servers:
- url: https://api.artie.com
paths:
  /column-hashing-salts:
    get:
      description: Lists all column hashing salts for the authenticated company.
      operationId: column_hashing_salt_list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyColumnHashingSalt'
          description: OK
        "500":
          description: Internal Server Error
      summary: List column hashing salts
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_list
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: List column hashing salts
        triggerDescription: Lists column hashing salt names and UUIDs (no secret).
    post:
      description: Creates a new column hashing salt for the authenticated company.
      operationId: column_hashing_salt_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterCreateColumnHashingSaltRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterCreateColumnHashingSaltResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts and returns a column-hashing salt.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: column_hashing_salt_create
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Create column-hashing salts through the authenticated Dashboard
          setup flow.
        requiredScopes:
        - column_hashing_salts:write
        retrySemantics: unsafe
        title: Create a column hashing salt
        triggerDescription: Use when you need to create a column hashing salt.
  /column-hashing-salts/{uuid}:
    delete:
      description: Deletes a column hashing salt by UUID.
      operationId: column_hashing_salt_delete
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - column_hashing_salts:delete
        retrySemantics: safe-after-state-check
        title: Delete a column hashing salt
        triggerDescription: Deletes a column hashing salt by UUID. Does not unhash
          already-landed columns.
    get:
      description: Retrieves a column hashing salt by UUID, including the decrypted
        salt. Requires company admin.
      operationId: column_hashing_salt_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsColumnHashingSaltDetail'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Returns the decrypted column-hashing salt.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_detail
        outputSensitivity: restricted-credentials
        readOnlyHint: true
        remediation: Use column_hashing_salt_list for non-secret salt references.
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: Get a column hashing salt
        triggerDescription: Use when you need to get a column hashing salt.
    post:
      description: Updates the name and description of a column hashing salt.
      operationId: column_hashing_salt_update
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterUpdateColumnHashingSaltRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsColumnHashingSalt'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_update
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - column_hashing_salts:write
        retrySemantics: unsafe
        title: Update a column hashing salt
        triggerDescription: Updates the name and description of an existing column
          hashing salt. Does not rotate the secret.
  /column-hashing-salts/{uuid}/preview:
    post:
      description: Hashes a sample string value with this salt using the same function
        used by Artie's pipelines (HMAC-SHA256 keyed on the salt, or SHA-256 if the
        salt is empty). Returns the hex-encoded hash.
      operationId: column_hashing_salt_preview
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPreviewColumnHashingSaltRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPreviewColumnHashingSaltResponse'
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Preview a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_preview
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: Preview a column hashing salt
        triggerDescription: Hashes a sample string with this salt and returns the
          hex digest.
  /company/automatic-schema-changes:
    post:
      description: Enqueues automatic schema changes for all eligible running pipelines
        in the authenticated company. The request is accepted before reconciliation
        completes.
      operationId: company_trigger_automatic_schema_changes
      responses:
        "202":
          description: Accepted
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: Trigger automatic schema changes
      tags:
      - Company
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: company_trigger_automatic_schema_changes
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: safe-after-state-check
        title: Trigger automatic schema changes for a company
        triggerDescription: Enqueues automatic schema changes for all eligible running
          pipelines. For one pipeline, use pipeline_trigger_automatic_schema_changes.
  /connectors:
    get:
      description: Returns all destination connectors for the authenticated company.
        Pass includeSourceConnectors=true to also include source connectors.
      operationId: connector_list
      parameters:
      - in: query
        name: includeSourceConnectors
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyLightConnector'
          description: OK
        "500":
          description: Internal Server Error
      summary: List connectors
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_list
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: List connectors
        triggerDescription: Lists saved connectors. Defaults to destinations; pass
          includeSourceConnectors=true for sources.
    post:
      description: Creates a new source or destination connector for your Artie deployment.
        Configure database connections, authentication, and replication settings programmatically.
      operationId: connector_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: connector_create
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Create connectors through the authenticated Dashboard setup flow.
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Create a connector
        triggerDescription: Use when you need to create a connector.
  /connectors/{uuid}:
    delete:
      description: Permanently removes a connector and its associated configuration.
        This stops any active replication pipelines that depend on the connector.
      operationId: connector_delete
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - connectors:delete
        retrySemantics: safe-after-state-check
        title: Delete a connector
        triggerDescription: Permanently deletes a saved connector by UUID and stops
          pipelines that depend on it.
    get:
      description: Retrieves the full configuration and status of a connector by its
        unique identifier, including connection settings and current replication state.
      operationId: connector_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Returns connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_detail
        outputSensitivity: restricted-credentials
        readOnlyHint: true
        remediation: Use connector_fetch_table_detail or the authenticated Dashboard
          for connector configuration.
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Get a connector
        triggerDescription: Use when you need to get a connector.
    post:
      description: Updates the configuration of an existing source or destination
        connector. Modify connection settings, credentials, or replication parameters
        for a running pipeline.
      operationId: connector_update
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts and returns connector configuration that can contain
          credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: connector_update
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Update connector credentials through the authenticated Dashboard
          setup flow.
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Update a connector
        triggerDescription: Use when you need to update a connector.
  /connectors/{uuid}/databases:
    get:
      description: Lists available databases on the target using a saved connector's
        configuration. Response metadata may include Iceberg S3 table bucket maintenance
        defaults.
      operationId: connector_fetch_databases
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorFetchDatabasesResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch databases for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_databases
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch databases for a saved connector
        triggerDescription: Lists database names a saved source can see.
  /connectors/{uuid}/detail:
    get:
      description: Returns detailed metadata for a specific table on the saved connector.
        tableName is required; databaseName defaults to the connector's configured
        database, schemaName defaults to the connector type's default schema, and
        isView is optional.
      operationId: connector_fetch_table_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      - in: query
        name: schemaName
        schema:
          type: string
      - in: query
        name: tableName
        required: true
        schema:
          type: string
      - in: query
        name: isView
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorTableDetailResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch table detail for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_table_detail
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch table detail for a saved connector
        triggerDescription: Returns columns and metadata for one table on a saved
          connector.
  /connectors/{uuid}/generate-shadow-script:
    post:
      description: Generates the SQL script to create shadow tables required for Oracle
        change data capture (CDC). Run this script on your Oracle source before starting
        replication.
      operationId: connector_generate_shadow_script
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorGenerateShadowScriptRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorGenerateShadowScriptResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Generate Oracle shadow table script
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_generate_shadow_script
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Generate Oracle shadow table script
        triggerDescription: Returns SQL to create Oracle shadow tables for CDC. Oracle
          sources only.
  /connectors/{uuid}/postgres-drop-replication-slot:
    post:
      description: Drops a PostgreSQL replication slot that is inactive or orphaned.
        Use this to clean up stale replication slots that may be preventing WAL cleanup
        on the source.
      operationId: connector_drop_postgres_replication_slot
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorDropReplicationSlotRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Drop a PostgreSQL replication slot
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_drop_postgres_replication_slot
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Drop a PostgreSQL replication slot
        triggerDescription: Drops an inactive PostgreSQL replication slot. Confirm
          the slot is unused.
  /connectors/{uuid}/schemas:
    get:
      description: Lists available schemas on the target using a saved connector's
        configuration. Pass 'databaseName' as a query parameter.
      operationId: connector_fetch_schemas
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodySchemaResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch schemas for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_schemas
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch schemas for a saved connector
        triggerDescription: Lists schemas on a saved connector. Pass schemaName into
          connector_fetch_tables when the destination requires it.
  /connectors/{uuid}/start-dynamodb-export:
    post:
      description: Initiates a point-in-time export from Amazon DynamoDB for the specified
        connector. Use this to backfill your destination with existing DynamoDB table
        data.
      operationId: connector_start_dynamo_db_export
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorStartDynamoDBExportRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorStartDynamoDBExportResponse'
          description: OK
        "500":
          description: Internal Server Error
      summary: Start a DynamoDB export
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_start_dynamo_db_export
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Start a DynamoDB export
        triggerDescription: Starts a DynamoDB point-in-time export. DynamoDB sources
          only; for SQL CDC use pipeline_start.
  /connectors/{uuid}/tables:
    get:
      description: Lists available tables on the target using a saved connector's
        configuration. databaseName defaults to the connector's configured database;
        schemaName defaults to the connector type's default schema (e.g. 'public'
        for Postgres, 'dbo' for SQL Server).
      operationId: connector_fetch_tables
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      - in: query
        name: schemaName
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyConnectorTableDetailResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch tables for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_tables
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch tables for a saved connector
        triggerDescription: Lists tables on a saved connector. Use to choose names
          for pipeline_update.tables.
  /connectors/databases:
    post:
      description: Lists available databases on the target using an unsaved connector
        configuration. Useful during connector setup to discover existing databases.
        Response metadata may include Iceberg S3 table bucket maintenance defaults.
      operationId: unsaved_connector_fetch_databases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorFetchDatabasesResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch databases for an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts an unsaved connector configuration that can contain
          credentials.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_fetch_databases
        outputSensitivity: none
        readOnlyHint: true
        remediation: Save the connector before discovering databases.
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch databases for an unsaved connector
        triggerDescription: Use when you need to fetch databases for an unsaved connector.
  /connectors/new-database:
    post:
      description: Creates a new database on the target destination using a connector
        configuration that has not yet been saved. Useful during initial setup to
        prepare the destination.
      operationId: unsaved_connector_create_database
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorCreateDatabaseRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a database on an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exclusionReason: Accepts an unsaved connector configuration that can contain
          credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_create_database
        outputSensitivity: none
        readOnlyHint: false
        remediation: Create the database through the authenticated Dashboard setup
          flow.
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Create a database on an unsaved connector
        triggerDescription: Use when you need to create a database on an unsaved connector.
  /connectors/new-schema:
    post:
      description: Creates a new schema on the target destination using a connector
        configuration that has not yet been saved. Useful during initial setup to
        organize destination tables.
      operationId: unsaved_connector_create_schema
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorCreateSchemaRequest'
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a schema on an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exclusionReason: Accepts an unsaved connector configuration that can contain
          credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_create_schema
        outputSensitivity: none
        readOnlyHint: false
        remediation: Create the schema through the authenticated Dashboard setup flow.
        requiredScopes:
