    RouterPipelineValidateUnsavedSourceRequest:
      properties:
        allowDroppedTablesPipelineUUID:
          description: 'Set it to a pipeline with autoStopDroppedTables on: that pipeline''s
            already deployed tables pass validation if they no longer exist in the
            source, since the table changes check stops them. Every other table and
            check is validated as usual. Only Postgres sources honor it.'
          format: uuid
          type:
          - "null"
          - string
        dataPlaneName:
          type: string
        dynamoDBBackfillConfig:
          $ref: '#/components/schemas/PayloadsDynamoDBSnapshotConfig'
        sourceConnector:
