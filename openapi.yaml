        triggerDescription: Replaces the full pipeline configuration (not a PATCH).
          Echo the last FullPipeline from pipeline_create_from_source, pipeline_update,
          or pipeline_detail — not pipeline_list — and send destinationUUID and tables
          together; a destination-only body is rejected and omitting tables deletes
