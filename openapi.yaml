        required: true
        schema:
          description: The UUID of the Kafka cluster, as returned by its list or create
            endpoint.
          type: string
      - description: How many messages to return, 20 if left out.
        in: query
        name: limit
        schema:
          description: How many messages to return, 20 if left out.
          maximum: 50
          minimum: 1
