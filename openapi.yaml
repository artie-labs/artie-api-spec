          - "null"
          - string
        s3Prefix:
          description: Key prefix for the export files within the bucket. Null uses
            no prefix.
          type:
          - "null"
          - string
      required:
      - s3Bucket
      type: object
    RouterConnectorStartDynamoDBExportResponse:
      properties:
        exportARN:
          description: The ARN of the export DynamoDB started, to track it in AWS.
            The export runs in AWS after this returns.
          type: string
      required:
      - exportARN
      type: object
    RouterConnectorTable:
      properties:
        approxDateAdded:
          format: date-time
          type:
          - "null"
          - string
        columns:
          description: The table's columns. Only filled in by connector_fetch_table_detail,
            not when listing tables.
          items:
            $ref: '#/components/schemas/PayloadsConnectorColumn'
          type: array
        createdAt:
          description: When the table was created. Null when the source doesn't report
            it.
          format: date-time
          type:
          - "null"
          - string
        isView:
          description: Whether this is a view rather than a table.
          type: boolean
        metadata:
          description: Source-specific table properties, such as creation time or
            a Postgres table's internal ID.
          items:
            $ref: '#/components/schemas/PayloadsCatalogTableProperty'
          type: array
        modifiedAt:
          description: When the table was last modified. Null when the source doesn't
            report it.
          format: date-time
          type:
          - "null"
          - string
        name:
          description: The table name, to pass as tableName to connector_fetch_table_detail.
          type: string
        schema:
          description: The table's schema (or namespace). Empty for sources without
            schemas.
          type: string
        unreadable:
          description: True when Artie can't read the table, such as a Postgres table
            the connector's user can't select from or a Keyspaces table without a
            stream.
          type: boolean
      required:
      - schema
      - name
      - isView
      - createdAt
      - modifiedAt
