    PayloadsAdvancedPipelineSettingsPayload:
      properties:
        appendOnly:
          description: When true, rows are always appended instead of merged into
            the destination table. Use for append-only data such as event tracking.
          type:
          - "null"
          - boolean
        artieUpdatedAtColumnName:
          description: 'Name for the column includeArtieUpdatedAtColumn adds, instead
            of __artie_updated_at; empty goes back to __artie_updated_at. Saved in
            lowercase, as every column name is written. To change it, pause the pipeline
            and rename the column in the destination tables before resuming: Artie
            doesn''t rename columns in tables it already created. Not supported for
            ClickHouse.'
          type:
          - "null"
          - string
        autoEnableHistoryForNewTables:
          description: When true, new source tables are added with history mode on;
            without autoReplicateNewTables they are added history-only.
          type:
          - "null"
          - boolean
        autoEnableHistoryIgnoreRegex:
          description: Regex of full table names that are skipped while autoEnableHistoryForNewTables
            is on. Can't be combined with autoEnableHistoryIncludeRegex.
          type:
          - "null"
          - string
        autoEnableHistoryIncludeRegex:
          description: Regex of full table names; while autoEnableHistoryForNewTables
            is on, only new tables that match are auto-added. Can't be combined with
            autoEnableHistoryIgnoreRegex.
          type:
          - "null"
          - string
        autoReplicateIgnoreRegex:
          description: Regex of full table names that auto-replication skips. Can't
            be combined with autoReplicateIncludeRegex.
          type:
          - "null"
          - string
        autoReplicateIncludeRegex:
          description: Regex of full table names; only new tables that match are auto-added.
            Can't be combined with autoReplicateIgnoreRegex.
          type:
          - "null"
          - string
        autoReplicateNewTables:
          description: When true, new tables found in the source are added to the
            pipeline automatically.
          type:
          - "null"
          - boolean
        autoStopDroppedTables:
          description: When true, tables that no longer exist in the source stop streaming
            automatically. Destination tables and their data are kept. On sources
            other than Postgres, a table Artie lost access to also counts as dropped.
          type:
          - "null"
          - boolean
        backfillMySQLFloatsAsShortestDecimal:
          description: 'MySQL and PlanetScale sources only: backfills write FLOAT
            columns as their shortest decimal, as replication does, instead of the
            exact float32.'
          type:
          - "null"
          - boolean
        bigQueryReservation:
          description: 'BigQuery only: the reservation Transfer''s queries run in;
            empty uses the project default.'
          type:
          - "null"
          - string
        bufferRows:
          description: Rows to buffer before flushing to the destination, at least
            5; 0 or left out keeps the current value.
          type:
          - "null"
          - integer
        castAllColumnsToString:
          description: 'MongoDB and DocumentDB sources only: write every column, including
            the primary key, as a string. __artie_* columns keep their types.'
          type:
          - "null"
          - boolean
        databricksAutoLiquidClustering:
          description: 'Databricks only: turn on automatic liquid clustering for every
            destination table.'
          type:
          - "null"
          - boolean
        databricksDisableVariantShredding:
          description: 'Databricks only: turn off variant shredding on new tables
            and, after each deploy, existing ones. Already shredded data isn''t rewritten.'
          type:
          - "null"
          - boolean
        databricksUseZerobus:
          description: 'Databricks only: append to history tables and appendOnly tables
            through Zerobus Ingest instead of COPY INTO. Needs a connector that signs
            in with a service principal (OAuth M2M) and databricksZerobusEndpoint.'
          type:
          - "null"
          - boolean
        databricksZerobusEndpoint:
          description: 'Databricks only: the workspace''s Zerobus endpoint, https://<workspace
            id>.zerobus.<region>.cloud.databricks.com. Required when databricksUseZerobus
            is on.'
          type:
          - "null"
          - string
        defaultSourceSchema:
          description: Source schema whose tables aren't prefixed with the schema
            name in the destination.
          type:
          - "null"
          - string
        disableAlerts:
          description: When true, Artie stops sending email alerts for this pipeline.
            Health is still tracked in the dashboard.
          type:
          - "null"
          - boolean
        dropDeletedColumns:
          description: When true, columns dropped in the source are dropped in the
            destination too. History tables never drop columns.
          type:
          - "null"
          - boolean
        dynamoDBBackfillConfig:
          $ref: '#/components/schemas/PayloadsDynamoDBSnapshotConfig'
          description: 'DynamoDB sources only: how backfills read the table from a
            DynamoDB export to S3.'
        enableSoftDelete:
          description: When true, rows deleted in the source are kept and marked in
            an __artie_delete column instead of being deleted.
          type:
          - "null"
          - boolean
        flushIntervalSeconds:
          description: Seconds between flushes to the destination, 5 to 86400; 0 or
            left out keeps the current value. Transfer flushes sooner when bufferRows
            or flushSizeKb is reached.
          type:
          - "null"
          - integer
        flushSizeKb:
          description: Buffered data, in KB, that triggers a flush to the destination,
            up to 1572864 (1.5 GB); 0 or left out keeps the current value.
          type:
          - "null"
          - integer
        forceUTCTimezone:
          description: When true, source timestamp columns without a time zone are
            written as UTC timestamps with a time zone.
          type:
          - "null"
          - boolean
        includeArtieOperationColumn:
          description: When true, each row gets an __artie_operation column with the
            change type that wrote it.
          type:
          - "null"
          - boolean
        includeArtieUpdatedAtColumn:
          description: When true, each row gets an __artie_updated_at column with
            the time Artie wrote it.
          type:
          - "null"
          - boolean
        includeDatabaseUpdatedAtColumn:
          description: When true, each row gets an __artie_db_updated_at column with
            the time the change happened in the source. Always on for history tables.
          type:
          - "null"
          - boolean
        includeFullSourceTableNameColumn:
          description: When true, each row gets an __artie_full_source_table_name
            column with its source table's full name.
          type:
          - "null"
          - boolean
        includeFullSourceTableNameColumnAsPrimaryKey:
          description: When true, the __artie_full_source_table_name column is added
            to the primary key. Requires includeFullSourceTableNameColumn.
          type:
          - "null"
          - boolean
        includeSourceMetadataColumn:
          description: When true, each row gets an __artie_source_metadata column
            with the change's source metadata.
          type:
          - "null"
          - boolean
        jsonAsVarchar:
          description: 'Redshift only: store struct values as JSON text in VARCHAR(MAX)
            instead of SUPER.'
          type:
          - "null"
          - boolean
        jsonParseTruncateStrings:
          description: 'Redshift only: truncate strings inside SUPER values that are
            over Redshift''s limit instead of failing the load.'
          type:
          - "null"
          - boolean
        maxConcurrentSnapshots:
          description: Most table backfills this pipeline runs at once; 0 uses the
            company limit, and a set value must be between 1 and that limit.
          minimum: 0
          type:
          - "null"
          - integer
        postgresPartitionMirroring:
          description: 'Postgres source and destination only: create each partitioned
            source table''s partitions in the destination, including ones added later.'
          type:
          - "null"
          - boolean
        snowpipeStreamingMaxChannels:
          description: 'Snowflake only: the most Snowpipe Streaming channels Transfer
            opens.'
          type:
          - "null"
          - integer
        splitEventsByType:
          description: 'API sources only: when true, each event type gets its own
            table; when false, all events share one table with the event type as a
            column.'
          type:
          - "null"
          - boolean
        stagingSchema:
          description: Schema to create staging tables in; empty uses each table's
            own schema.
          type:
          - "null"
          - string
        staticColumns:
          description: Columns with fixed values added to every destination table.
          items:
            $ref: '#/components/schemas/PayloadsStaticColumn'
          type:
          - "null"
          - array
        structAsVariant:
          description: 'Databricks only: store new struct and array columns as VARIANT
            instead of STRING or ARRAY<string>.'
          type:
          - "null"
          - boolean
        truncateExceededValues:
          description: 'Redshift and BigQuery only: truncate values that are too large
            for their column instead of replacing them with __artie_exceeded_value.'
          type:
          - "null"
          - boolean
        turboLatencyThresholdMinutes:
          description: 'Snowflake Turbo Mode: ingestion lag, in minutes, that must
            be exceeded to switch to turboWarehouse. Defaults to 30.'
          type:
          - "null"
          - integer
        turboRowThreshold:
          description: 'Snowflake Turbo Mode: row lag that must be exceeded to switch
            to turboWarehouse. Defaults to 5,000,000.'
          type:
          - "null"
          - integer
        turboWarehouse:
          description: 'Snowflake only: a larger warehouse Turbo Mode switches to
            while the pipeline is behind.'
          type:
          - "null"
          - string
        useBQBatchPriority:
          description: 'BigQuery only: run Transfer''s queries with batch priority
            instead of interactive.'
          type:
          - "null"
          - boolean
        useBigNumericForVariableNumeric:
          description: 'BigQuery only: write variable-precision numeric columns as
            BIGNUMERIC.'
          type:
          - "null"
          - boolean
        useDoubleForVariableNumeric:
          description: 'MotherDuck only: write variable-precision numeric columns
            as DOUBLE.'
          type:
          - "null"
          - boolean
        useNewStringMethod:
          description: 'Databricks only: use Transfer''s newer string conversion;
            omitted uses the company setting.'
          type:
          - "null"
          - boolean
        useSnowpipeStreaming:
          description: 'Snowflake only: load data with Snowpipe Streaming.'
          type:
          - "null"
          - boolean
        writeRawBinaryValues:
          description: 'Databricks and MSSQL only: write binary values as raw binary
            instead of Base64-encoded strings.'
          type:
          - "null"
          - boolean
      type: object
    PayloadsAdvancedTableSettingsPayload:
      properties:
        alias:
          description: Destination table name to use instead of the source table name.
          type:
          - "null"
          - string
        bufferRows:
          description: Rows to buffer before flushing to the destination, at least
            5. Only used, and required, with individualDeployment.
          type:
          - "null"
          - integer
        columnsToCompress:
          description: 'Postgres sources only: columns the reader gzip-compresses
            in transit. Transfer decompresses them before writing.'
          items:
            type: string
          type: array
        columnsToEncrypt:
          description: Columns whose values are encrypted with the pipeline's encryption
            key before they're written.
          items:
            type: string
          type: array
        columnsToHash:
          description: 'Columns whose values are hashed before they''re written: HMAC-SHA256
            with the pipeline''s column hashing salt, or SHA-256 without one.'
          items:
            type: string
          type: array
        columnsToTrim:
          description: String columns whose leading and trailing whitespace is removed
            before they're written.
          items:
            type: string
          type: array
        ctidSettings:
          $ref: '#/components/schemas/PayloadsCTIDSettings'
          description: Postgres CTID backfill settings for this table; omitted uses
            the source reader's backfill defaults.
        dynamicTableTargetLag:
          description: How often the latest rows refresh, such as 1 minute (Snowflake
            TARGET_LAG, Databricks TRIGGER ON UPDATE interval); empty uses Transfer's
            default. Only used with enableDynamicTable.
          type:
          - "null"
          - string
        enableDynamicTable:
          description: 'Snowflake and Databricks only: stream changes into <table>__artie_changes,
            keep the latest row per key in a Snowflake dynamic table or Databricks
            streaming table, and make <table> a view over it.'
          type:
          - "null"
          - boolean
        encryptJSONBColumns:
          description: When true, the table's JSONB columns are encrypted with the
            pipeline's encryption key.
          type:
          - "null"
          - boolean
        excludeColumns:
          description: Source columns to leave out of the destination. Can't be combined
            with includeColumns.
          items:
            type: string
          type: array
        flattenDocuments:
          description: When true, nested document fields are flattened into their
            own columns.
          type:
          - "null"
          - boolean
        flattenDocumentsMaxDepth:
          description: How many levels of nesting flattenDocuments expands; 0 means
            no limit.
          minimum: 0
          type:
          - "null"
          - integer
        flushIntervalSeconds:
          description: Seconds between flushes to the destination, from 5 to 86400.
            Transfer flushes sooner when bufferRows or flushSizeKb is reached. Only
            used, and required, with individualDeployment.
          type:
          - "null"
          - integer
        flushSizeKb:
          description: Buffered data, in KB, that triggers a flush to the destination,
            up to 1.5 GB. Only used, and required, with individualDeployment.
          type:
          - "null"
          - integer
        includeColumns:
          description: The only source columns to write to the destination. Can't
            be combined with excludeColumns.
          items:
            type: string
          type: array
        k8sRequestCPU:
          description: CPU request for the table's own Transfer pod, in millicores.
            Only used with individualDeployment.
          minimum: 0
          type:
          - "null"
          - integer
        k8sRequestMemoryMB:
          description: Memory request for the table's own Transfer pod, in MiB. Only
            used with individualDeployment.
          minimum: 0
          type:
          - "null"
          - integer
        mergePredicates:
          description: Partition columns Transfer adds to its MERGE condition.
          items:
            $ref: '#/components/schemas/PayloadsMergePredicates'
          type: array
        msmFlushCount:
          description: 'Multi-step merge: how many flushes Transfer stages before
            merging into the destination table; 0 turns it off.'
          minimum: 0
          type:
          - "null"
          - integer
        partitionRangeSettings:
          $ref: '#/components/schemas/PayloadsPartitionRangeSettings'
          description: 'Postgres sources only: backfill a partitioned table by reading
            each partition. Cannot be enabled together with rangeSettings or ctidSettings.'
        primaryKeysOverride:
          description: Columns to use as the destination primary key instead of the
            source table's primary key.
          items:
            type: string
          type:
          - array
          - "null"
        rangeSettings:
          $ref: '#/components/schemas/PayloadsRangeSettings'
          description: Range backfill settings for this table; omitted uses the source
            reader's backfill defaults.
        shouldBackfillHistoryTable:
          description: When true, the history table is backfilled too; otherwise only
            the regular table is.
          type:
          - "null"
          - boolean
        skipBackfill:
          description: When true, the table skips its initial backfill and starts
            streaming when first deployed.
          type:
          - "null"
          - boolean
        skipDelete:
          description: When true, delete events are skipped, so rows deleted in the
            source stay in the destination.
          type:
          - "null"
          - boolean
        skipNoOpUpdates:
          description: 'Postgres sources only: skip update events whose before and
            after rows are identical after column filters. Requires REPLICA IDENTITY
            FULL.'
          type:
          - "null"
          - boolean
        softPartitioning:
          $ref: '#/components/schemas/PayloadsSoftPartitioning'
          description: Splits the destination table into time-based partition tables.
        streamARN:
          description: 'Amazon Keyspaces only: the table''s CDC stream ARN.'
          type:
          - "null"
          - string
        unifyAcrossDatabases:
          description: When the source reader unifies across databases, this table
            is read from every matching database into one destination table. Only
            PlanetScale reads it per table.
          type:
          - "null"
          - boolean
        unifyAcrossSchemas:
          description: 'Postgres and MySQL: when the source reader unifies across
            schemas, this table is read from every matching schema into one destination
            table.'
          type:
          - "null"
          - boolean
      type: object
    PayloadsAnalyticsDimensions:
      properties:
        operation:
          description: 'The row operation the series counts: create, backfill, update,
            delete or other.'
          type: string
        pipelineUUID:
          description: UUID of the pipeline the series belongs to, when grouped by
            pipeline.
          format: uuid
          type:
          - "null"
          - string
        reason:
          description: Why Transfer flushed, for the flushCount dataset.
          type: string
        slot:
          description: Postgres replication slot name, for the replicationSlotSize
            dataset.
          type: string
        table:
          description: The table the series belongs to, when grouped by table.
          type: string
        warehouseName:
          description: Snowflake warehouse name, for the Snowflake datasets.
          type: string
        warehouseSize:
          description: Snowflake warehouse size, for the Snowflake datasets.
          type: string
      type: object
    PayloadsAnalyticsScalarIntPoint:
      properties:
        value:
          description: The value over the whole time window, in the dataset's unit.
          format: int64
          type: integer
      type: object
    PayloadsAnalyticsScalarSeries:
      properties:
        dimensions:
          $ref: '#/components/schemas/PayloadsAnalyticsDimensions'
          description: The tags that identify this series.
        granularityInterval:
          description: Seconds between points in a timeseries; null for scalar results.
          type:
          - "null"
          - integer
        points:
          description: The series' data points.
          items:
            $ref: '#/components/schemas/PayloadsAnalyticsScalarIntPoint'
          type:
          - array
          - "null"
      type: object
    PayloadsAnalyticsTimeseries:
      properties:
        dimensions:
          $ref: '#/components/schemas/PayloadsAnalyticsDimensions'
          description: The tags that identify this series.
        granularityInterval:
          description: Seconds between points in a timeseries; null for scalar results.
          type:
          - "null"
          - integer
        points:
          description: The series' data points.
          items:
            $ref: '#/components/schemas/PayloadsAnalyticsTimeseriesPoint'
          type:
          - array
          - "null"
      type: object
    PayloadsAnalyticsTimeseriesPoint:
      properties:
        time:
          description: The point's time, in Unix milliseconds.
          format: int64
          type: integer
        value:
          description: The metric value at that time, in the dataset's unit.
          format: double
          type: number
      type: object
    PayloadsAnalyticsUnit:
      enum:
      - count
      - megabytes
      - ms
      - bytes
      type: string
    PayloadsBYOCKafkaClusterSettings:
      properties:
        brokers:
          description: 'How many brokers the cluster runs: the replicas of its node
            pools with the broker role, added up.'
          type: integer
        kafkaVersion:
          description: The Kafka version the Kafka resource asks for, such as 4.2.0,
            else the one Strimzi reports running. Left out when neither is set.
          type: string
        storageClass:
          description: The Kubernetes storage class of the brokers' disks. Left out
            when the disks name none and the Kubernetes cluster's default class is
            used.
          type: string
        storageGiB:
          description: Disk per broker in GiB, all its volumes added up. Left out
            when the brokers have no persistent disks.
          type: integer
        supported:
          description: Whether these settings can be read for the cluster. Only BYOC
            Strimzi clusters linked to their Kubernetes cluster have them; Managed
            Kafka clusters show theirs in the cluster's managed field, and MSK clusters
            have none.
          type: boolean
      required:
      - supported
      type: object
    PayloadsBackfillDefaultsPayload:
      properties:
        chunkSize:
          description: Size of each chunk a range or CTID backfill reads.
          maximum: 1e+08
          minimum: 100000
          type: integer
        pagination:
          description: Whether backfill queries page through rows on the client or
            on the database server.
          enum:
          - client
          - server
          type: string
        parallelism:
          description: How many chunks a range or CTID backfill reads at once.
          maximum: 50
          minimum: 1
          type: integer
        preset:
          description: Backfill speed preset. Range reads only use chunkSize and parallelism
            with the performance preset.
          enum:
          - normal
          - performance
          type: string
        readMode:
          description: How backfills read each table; range and ctid split it into
            chunks read in parallel.
          enum:
          - primaryKey
          - range
          - ctid
          type: string
      type: object
    PayloadsBackfillStageEvent:
      properties:
        error:
          description: Why the backfill failed, sent with the failed stage.
          type: string
        rowsWritten:
          description: Rows the reader reported with the stage, such as on done.
          format: int64
          type: integer
        stage:
          $ref: '#/components/schemas/EnumsBackfillStage'
          description: The backfill stage reached.
        timestamp:
          description: When the stage was reached, in RFC 3339.
          format: date-time
          type: string
      required:
      - stage
      - timestamp
      type: object
    PayloadsBigQuerySettings:
      properties:
        partitionBy:
          type: string
        partitionField:
          type: string
        partitionType:
          type: string
      type: object
    PayloadsCTIDSettings:
      properties:
        chunkSize:
          description: Target rows in each CTID range. 0 uses the reader's default;
            a set value must be at least 100,000.
          minimum: 0
          type: integer
        enabled:
          description: When true, the backfill reads the table in parallel ranges
            of physical row locations (Postgres CTIDs) instead of by primary key.
            Can't be combined with partitionRangeSettings.
          type: boolean
        maxParallelism:
          description: How many CTID ranges are read at once, up to the company's
            backfill parallelism limit; 0 uses the reader's default.
          minimum: 0
          type: integer
        physicalRanges:
          $ref: '#/components/schemas/PayloadsPhysicalCTIDRangeSettings'
          description: Sizes each CTID range in heap pages instead of by chunkSize.
            Needs enabled, and can't be used when the source reader unifies across
            schemas.
      type: object
    PayloadsCatalogTableProperty:
      properties:
        isDate:
          description: Whether value is a timestamp.
          type: boolean
        key:
          description: The property name.
          type: string
        value:
          $ref: '#/components/schemas/PayloadsJSONValue'
          description: The property value, as the source reports it.
      required:
      - key
      - value
      - isDate
      type: object
    PayloadsColumnHashingSalt:
      properties:
        createdAt:
          description: When the salt was created.
          format: date-time
          type: string
        description:
          description: Free-text notes about the salt.
          type: string
        name:
          description: Display name for the salt.
          type: string
        updatedAt:
          description: When the salt was last changed.
          format: date-time
          type: string
        uuid:
          description: The column hashing salt's UUID. Pipelines reference it in columnHashingSaltUUID.
          format: uuid
          type: string
      required:
      - uuid
      - name
      type: object
    PayloadsColumnHashingSaltDetail:
      properties:
        createdAt:
          description: When the salt was created.
          format: date-time
          type: string
        description:
          description: Free-text notes about the salt.
          type: string
        name:
          description: Display name for the salt.
          type: string
        salt:
          description: The decrypted salt that keys the HMAC-SHA256 hash of hashed
            columns.
          type: string
        updatedAt:
          description: When the salt was last changed.
          format: date-time
          type: string
        uuid:
          description: The column hashing salt's UUID. Pipelines reference it in columnHashingSaltUUID.
          format: uuid
          type: string
      required:
      - uuid
      - name
      - salt
      type: object
    PayloadsCompactionConfig:
      properties:
        enabled:
          description: When true, Transfer compacts Delta tables on a schedule.
          type: boolean
        everySeconds:
          description: How often each table is compacted, in seconds; 0 uses Transfer's
            default of 86400.
          type: integer
        quietWindow:
          $ref: '#/components/schemas/PayloadsCompactionQuietWindow'
          description: Optional UTC time window compaction is limited to.
      type: object
    PayloadsCompactionQuietWindow:
      properties:
        end:
          description: End of the window in HH:MM UTC, such as 06:00. Must differ
            from start.
          type: string
        start:
          description: Start of the window in HH:MM UTC, such as 02:00. Set together
            with end.
          type: string
      type: object
    PayloadsConnectorColumn:
      properties:
        metadata:
          $ref: '#/components/schemas/PayloadsConnectorColumnMetadata'
          description: The column's type and constraints.
        name:
          description: The column name.
          type: string
      required:
      - name
      - metadata
      type: object
    PayloadsConnectorColumnMetadata:
      properties:
        comment:
          description: The column comment set in the source, if any.
          type: string
        dataType:
          description: The column's data type, as the source names it.
          type: string
        defaultValue:
          description: The column's default expression. Omitted when it has none.
          type: string
        isPrimaryKey:
          description: Whether the column is part of the primary key. Omitted when
            the source doesn't report it.
          type: boolean
        notNull:
          description: Whether the column is NOT NULL.
          type: boolean
      required:
      - dataType
      - notNull
      type: object
    PayloadsConnectorFetchDatabasesResponse:
      properties:
        items:
          description: The databases the connector can see.
          items:
            $ref: '#/components/schemas/PayloadsDatabaseListItem'
          type: array
        metadata:
          description: Catalog-level properties, such as an Iceberg S3 Tables bucket's
            maintenance settings. Omitted when the source has none.
          items:
            $ref: '#/components/schemas/PayloadsCatalogTableProperty'
          type: array
      required:
      - items
      type: object
    PayloadsConnectorPayload:
      properties:
        dataPlaneName:
          description: The data plane to connect from. Empty uses the company's default
            data plane.
          type: string
        defaultDatabase:
          description: The database to connect to when a request doesn't name one.
            Required to test a Postgres (database), Oracle (service name) or S3 (bucket)
            connection. Omit on update to keep the saved value.
          type:
          - "null"
          - string
        draftPipelineUUID:
          description: 'On create only: the draft pipeline this connector is for.'
          format: uuid
          type:
          - "null"
          - string
        environmentUUID:
          description: 'On create only: the environment for the new connector. Required
            for company-wide API keys and MCP grants; ignored for environment-bound
            credentials.'
          format: uuid
          type:
          - "null"
          - string
        label:
          description: The connector's display name.
          type: string
        privateLinkUUID:
          description: The PrivateLink connection to reach the database through; its
            DNS entry replaces the host. Omit or null for none.
          format: uuid
          type:
          - "null"
          - string
        sharedConfig:
          additionalProperties: {}
          description: The type-specific connection settings. To keep a saved secret,
            send back the masked placeholder with the saved connector's uuid.
          type:
          - object
          - "null"
        snapshotPrivateLinkUUID:
          description: The PrivateLink connection for the snapshot (read replica)
            host; its DNS entry replaces the snapshot host. Omit or null for none.
          format: uuid
          type:
          - "null"
          - string
        sshTunnelUUID:
          description: The SSH tunnel to reach the database through. Omit or null
            for none.
          format: uuid
          type:
          - "null"
          - string
        type:
          description: The connector type slug, matched case-insensitively.
          type: string
        uuid:
          description: The saved connector's UUID, from connector_list. Send it when
            testing or reusing a saved connector so masked secrets in sharedConfig
            are filled from it; omit for a new connector.
          type: string
      type: object
    PayloadsConnectorTableDetailResponse:
      properties:
        columns:
          description: The table's columns. Only filled in by connector_fetch_table_detail,
            not when listing tables.
          items:
            $ref: '#/components/schemas/PayloadsConnectorColumn'
          type: array
        createdAt:
          description: When the table was created. Null when the source doesn't report
            it.
          format: date-time
          type:
          - "null"
          - string
        isView:
          description: Whether this is a view rather than a table.
          type: boolean
        metadata:
          description: Source-specific table properties, such as creation time or
            a Postgres table's internal ID.
          items:
            $ref: '#/components/schemas/PayloadsCatalogTableProperty'
          type: array
        modifiedAt:
          description: When the table was last modified. Null when the source doesn't
            report it.
          format: date-time
          type:
          - "null"
          - string
        name:
          description: The table name, to pass as tableName to connector_fetch_table_detail.
          type: string
        schema:
          description: The table's schema (or namespace). Empty for sources without
            schemas.
          type: string
        unreadable:
          description: True when Artie can't read the table, such as a Postgres table
            the connector's user can't select from or a Keyspaces table without a
            stream.
          type: boolean
      required:
      - schema
      - name
      - isView
      - createdAt
      - modifiedAt
      - unreadable
      type: object
    PayloadsDataCatalogDatabase:
      properties:
        name:
          description: The database name.
          type: string
      required:
      - name
      type: object
    PayloadsDataCatalogMatch:
      properties:
        connectorUUID:
          description: The source connector the object belongs to, usable as {uuid}
            in the connector_fetch_* tools.
          format: uuid
          type: string
        object:
          $ref: '#/components/schemas/PayloadsDataCatalogMatchedObject'
          description: The matched database, schema or table; exactly one of its fields
            is set.
        score:
          description: Search relevance score; higher is a better match.
          format: double
          type: number
      required:
      - score
      - connectorUUID
      - object
      type: object
    PayloadsDataCatalogMatchedObject:
      properties:
        database:
          $ref: '#/components/schemas/PayloadsDataCatalogDatabase'
          description: Set when the hit is a database.
        schema:
          $ref: '#/components/schemas/PayloadsDataCatalogSchema'
          description: Set when the hit is a schema.
        table:
          $ref: '#/components/schemas/PayloadsDataCatalogTable'
          description: Set when the hit is a table.
      type: object
    PayloadsDataCatalogSchema:
      properties:
        databaseName:
          description: The database the schema is in.
          type: string
        name:
          description: The schema name.
          type: string
      required:
      - name
      - databaseName
      type: object
    PayloadsDataCatalogSearchRequest:
      properties:
        query:
          description: Text to match against database, schema and table names. Matches
            substrings case-insensitively and tolerates typos. At most 100 characters.
          type: string
      type: object
    PayloadsDataCatalogTable:
      properties:
        databaseName:
          description: The database the table is in.
          type: string
        name:
          description: The table name.
          type: string
        schemaName:
          description: The schema the table is in.
          type: string
      required:
      - name
      - schemaName
      - databaseName
      type: object
    PayloadsDatabaseListItem:
      properties:
        name:
          description: The database name, to pass as databaseName to the other connector_fetch_*
            tools.
          type: string
      required:
      - name
      type: object
    PayloadsDynamoDBSnapshotConfig:
      properties:
        bucket:
          description: S3 bucket for a new export. Not needed when exportArn is set.
          type: string
        enabled:
          description: When true, backfills read the table from a DynamoDB export
            to S3.
          type: boolean
        exportArn:
          description: ARN of the DynamoDB export to backfill from.
          type: string
        maxParallelism:
          description: How many export files the backfill reads and writes at once;
            0 uses the reader's default of 1.
          minimum: 0
          type: integer
        optionalFolder:
          description: Folder in the bucket that holds the export.
          type: string
      type: object
    PayloadsEncryptionKey:
      properties:
        createdAt:
          description: When the key was created.
          format: date-time
          type: string
        description:
          description: Free-text notes about the key.
          type: string
        kmsKeyUUID:
          description: The KMS key that generated this data key. Only set when type
            is kms.
          format: uuid
          type:
          - "null"
          - string
        name:
          description: Display name for the key.
          type: string
        type:
          description: 'How the key was made: passphrase for an Artie-generated passphrase,
            kms for a data key generated with the customer''s AWS KMS key.'
          type: string
        updatedAt:
          description: When the key was last changed.
          format: date-time
          type: string
        uuid:
          description: The encryption key's UUID.
          format: uuid
          type: string
      required:
      - uuid
      - name
      - type
      type: object
    PayloadsEncryptionKeyDetail:
      properties:
        createdAt:
          description: When the key was created.
          format: date-time
          type: string
        description:
          description: Free-text notes about the key.
          type: string
        key:
          description: 'The secret key: the plaintext passphrase, or for kms keys
            the KMS-encrypted data key.'
          type: string
        kmsKeyUUID:
          description: The KMS key that generated this data key. Only set when type
            is kms.
          format: uuid
          type:
          - "null"
          - string
        name:
          description: Display name for the key.
          type: string
        type:
          description: 'How the key was made: passphrase for an Artie-generated passphrase,
            kms for a data key generated with the customer''s AWS KMS key.'
          type: string
        updatedAt:
          description: When the key was last changed.
          format: date-time
          type: string
        uuid:
          description: The encryption key's UUID.
          format: uuid
          type: string
      required:
      - uuid
      - name
      - type
      - key
      type: object
    PayloadsFullConnector:
      properties:
        companyUUID:
          description: The company that owns the connector.
          format: uuid
          type: string
        connectionLabel:
          description: A short summary of where the connector points, such as its
            host, built from the config. Empty if the config is incomplete.
          type: string
        createdAt:
          description: When the connector was created.
          format: date-time
          type: string
        dataPlaneName:
          description: The data plane that connects to this database. Unset means
            the company's default data plane.
          type:
          - "null"
          - string
        defaultDatabase:
          description: The database to connect to when a request doesn't name one.
          type: string
        draftPipelineUUID:
          description: The draft pipeline this connector was created for. Unset once
            a pipeline or source reader past draft uses it.
          format: uuid
          type:
          - "null"
          - string
        environmentUUID:
          description: The environment the connector belongs to.
          format: uuid
          type: string
        isValid:
          description: Whether the saved config passes validation, such as having
            every required field.
          type: boolean
        label:
          description: 'Display name: the connector''s name, or for an unnamed Snowflake
            connector its type and account.'
          type: string
        privateLinkUUID:
          description: The PrivateLink connection used to reach the database, if any.
            Its DNS entry replaces the configured host.
          format: uuid
          type:
          - "null"
          - string
        sharedConfig:
          $ref: '#/components/schemas/PayloadsJSONValue'
          description: The type-specific connection settings. Secrets come back as
            a masked placeholder for most callers, MCP clients included.
        snapshotPrivateLinkUUID:
          description: The PrivateLink connection used to reach the snapshot (read
            replica) host, if any.
          format: uuid
          type:
          - "null"
          - string
        sshTunnelUUID:
          description: The SSH tunnel used to reach the database, if any.
          format: uuid
          type:
          - "null"
          - string
        type:
          $ref: '#/components/schemas/EnumsConnectorSlug'
          description: The connector type.
        updatedAt:
          description: When the connector was last changed.
          format: date-time
          type: string
        uuid:
          description: The connector's UUID, used as {uuid} in the connector_* tools.
          format: uuid
          type: string
      required:
      - label
      - uuid
      - createdAt
      - updatedAt
      - type
      - companyUUID
      - environmentUUID
      - isValid
      type: object
    PayloadsFullPipeline:
      properties:
        advancedSettings:
          $ref: '#/components/schemas/PayloadsPipelineAdvancedSettings'
          description: The pipeline's advanced settings.
        backfillStages:
          description: The latest backfill stage of each regular table that recorded
            one. Can be stale once a table stops backfilling; read with hasBackfillingTables.
          items:
            $ref: '#/components/schemas/PayloadsBackfillStageEvent'
          type: array
        columnHashingSaltUUID:
          description: UUID of the salt used to hash columnsToHash, if any.
          format: uuid
          type:
          - "null"
          - string
        companyUUID:
          description: UUID of the company that owns the pipeline.
          format: uuid
          type: string
        createdAt:
          description: When the pipeline was created, in RFC 3339.
          format: date-time
          type: string
        dataPlaneName:
          description: Name of the data plane the pipeline runs on.
          type: string
        destinationUUID:
          description: UUID of the destination connector.
          format: uuid
          type:
          - "null"
          - string
        encryptionKeyUUID:
          description: UUID of the encryption key used for columnsToEncrypt, if any.
          format: uuid
          type:
          - "null"
          - string
        environmentUUID:
          description: UUID of the environment the pipeline belongs to.
          format: uuid
          type: string
        forceFlushUntil:
          description: When the current force flush ends, in RFC 3339. Set only while
            a force flush overrides the flush settings.
          format: date-time
          type:
          - "null"
          - string
        hasBackfillingTables:
          description: True when one or more tables are in their initial backfill.
          type: boolean
        hasUndeployedChanges:
          description: True when the pipeline has saved changes that haven't been
            deployed.
          type: boolean
        historyBackfillStages:
          description: The latest backfill stage of each history table that recorded
            one. Can be stale once a table stops backfilling; read with hasBackfillingTables.
          items:
            $ref: '#/components/schemas/PayloadsBackfillStageEvent'
          type: array
        icebergNativeEngine:
          description: True when an Iceberg pipeline writes with the native engine,
            the only one that can create v3 tables.
          type: boolean
        isDeploying:
          description: True while a deploy of the pipeline is in progress.
          type: boolean
        lastDeployError:
          description: Why the last deploy failed. Cleared once a later deploy succeeds.
          type: string
        lastDeployFailedAt:
          description: When the last deploy failed, in RFC 3339. Cleared once a later
            deploy succeeds.
          format: date-time
          type:
          - "null"
          - string
        lastDeployedAt:
          description: When the pipeline was last deployed, in RFC 3339. Omitted if
            it never was.
          format: date-time
          type:
          - "null"
          - string
        lastUpdatedAt:
          description: When the pipeline was last saved, in RFC 3339.
          format: date-time
          type: string
        name:
          description: The pipeline's display name.
          type: string
        snowflakeEcoScheduleUUID:
          description: UUID of the Snowflake eco schedule the pipeline uses, if any.
          format: uuid
          type:
          - "null"
          - string
        sourceReaderUUID:
          description: UUID of the source reader the pipeline reads from, for source_reader_detail.
          format: uuid
          type: string
        sourceType:
          $ref: '#/components/schemas/EnumsConnectorSlug'
          description: The source connector's type.
        specificDestCfg:
          $ref: '#/components/schemas/PayloadsSpecificConfig'
          description: Destination-specific settings, such as the database, schema
            or bucket to write to.
        status:
          $ref: '#/components/schemas/EnumsPipelineStatus'
          description: The pipeline's run state.
        tables:
          description: The pipeline's tables, with their UUIDs and status.
          items:
            $ref: '#/components/schemas/PayloadsTable'
          type: array
        uuid:
          description: The pipeline's UUID.
          format: uuid
          type: string
      required:
      - uuid
      - companyUUID
      - dataPlaneName
      - environmentUUID
      - name
      - createdAt
      - lastUpdatedAt
      - isDeploying
      - sourceType
      - hasUndeployedChanges
      - tables
      - specificDestCfg
      - advancedSettings
      type: object
    PayloadsIngestionAPIKey:
      properties:
        companyUUID:
          description: The company that owns the key.
          format: uuid
          type: string
        createdAt:
          description: When the key was created.
          format: date-time
          type: string
        expiresAt:
          description: When the key stops working. Null or left out means it never
            expires.
          format: date-time
          type:
          - "null"
          - string
        last4:
          description: The last four characters of the secret, to tell keys apart.
            The full secret is only returned on create.
          type: string
        name:
          description: Display name for the key.
          type: string
        sourceReaderUUID:
          description: The source reader that accepts events sent with this key.
          format: uuid
          type: string
        updatedAt:
          description: When the key was last changed.
          format: date-time
          type: string
        uuid:
          description: The ingestion API key's UUID.
          format: uuid
          type: string
      required:
      - uuid
      - createdAt
      - updatedAt
      - name
      - last4
      - sourceReaderUUID
      - companyUUID
      type: object
    PayloadsJSONValue:
      anyOf:
      - $ref: '#/components/schemas/PayloadsJsonValueString'
      - $ref: '#/components/schemas/PayloadsJsonValueNumber'
      - $ref: '#/components/schemas/PayloadsJsonValueBoolean'
      - $ref: '#/components/schemas/PayloadsJsonValueObject'
      - $ref: '#/components/schemas/PayloadsJsonValueArray'
      - $ref: '#/components/schemas/PayloadsJsonValueNull'
    PayloadsJsonValueArray:
      items:
        $ref: '#/components/schemas/PayloadsJsonValueArrayItem'
      type: array
    PayloadsJsonValueArrayItem:
      anyOf:
      - $ref: '#/components/schemas/PayloadsJsonValueString'
      - $ref: '#/components/schemas/PayloadsJsonValueNumber'
      - $ref: '#/components/schemas/PayloadsJsonValueBoolean'
      - $ref: '#/components/schemas/PayloadsJsonValueObject'
      - $ref: '#/components/schemas/PayloadsJsonValueNull'
    PayloadsJsonValueBoolean:
      oneOf:
      - type: boolean
      type: boolean
    PayloadsJsonValueNull:
      oneOf:
      - type: "null"
      type: "null"
    PayloadsJsonValueNumber:
      oneOf:
      - type: number
      type: number
    PayloadsJsonValueObject:
      additionalProperties: true
      type: object
    PayloadsJsonValueString:
      oneOf:
      - type: string
      type: string
    PayloadsKafkaBrokerConfig:
      properties:
        name:
          description: The broker config key, such as min.insync.replicas.
          type: string
        value:
          description: The config's value, as a string.
          type: string
      required:
      - name
      - value
      type: object
    PayloadsKafkaBrokerDefaults:
      properties:
        configs:
          description: Each config the brokers leave at Kafka's default, with that
            default, sorted by name.
          items:
            $ref: '#/components/schemas/PayloadsKafkaBrokerConfig'
          type: array
      required:
      - configs
      type: object
    PayloadsKafkaCluster:
      properties:
        cloud:
          description: The cloud provider the cluster runs in. Empty when unknown.
          type: string
        createdAt:
          description: When the cluster was added to Artie.
          format: date-time
          type: string
        dataKeptUntil:
          description: When a deleted Managed Kafka cluster's data is deleted for
            good. It can be restored until then. Only set while status is deleted.
          format: date-time
          type: string
        deployStage:
          $ref: '#/components/schemas/EnumsKafkaDeployStage'
          description: The step a Managed Kafka cluster's deploy is on. Only set while
            status is deploying, or failed, where it is the step the deploy stopped
            at.
        disableTLS:
          description: Whether clients connect without TLS.
          type: boolean
        externalBootstrapURL:
          description: Comma-separated host:port addresses clients connect to from
            outside. The SASL listener's addresses when usesScram is true.
          type: string
        isManaged:
          description: Whether this is a Managed Kafka cluster that Artie runs for
            the company.
          type: boolean
        localRetentionBytes:
          description: 'Disk cap per partition: the most broker disk each partition
            of the cluster''s tiered topics keeps, in bytes (log.local.retention.bytes).
            Missing when there is no cap.'
          type:
          - "null"
          - integer
        localRetentionMS:
          description: 'Days on disk: how long the cluster''s tiered topics keep data
            on broker disks, in ms (log.local.retention.ms). Missing on clusters made
            before it, whose brokers use Kafka''s default.'
          type:
          - "null"
          - integer
        managed:
          $ref: '#/components/schemas/PayloadsKafkaClusterManaged'
          description: A Managed Kafka cluster's configuration. Only set when isManaged,
            and only by Get a Kafka cluster.
        name:
          description: The cluster's display name.
          type: string
        region:
          description: The cloud region the cluster runs in. Empty when unknown.
          type: string
        shuttingDown:
          description: Whether a deleted Managed Kafka cluster is still being taken
            down. It can't be restored until that finishes. Only set in the clusters
            list.
          type: boolean
        status:
          $ref: '#/components/schemas/EnumsKafkaStatus'
          description: The cluster's lifecycle state.
        statusMessage:
          description: Why the last deploy of a Managed Kafka cluster failed. Only
            set while status is failed.
          type: string
        storageAutoscale:
          $ref: '#/components/schemas/PayloadsKafkaClusterStorageAutoscale'
          description: A Managed Kafka cluster's storage autoscaling. Only set when
            isManaged.
        tierAllTopics:
          description: Whether Artie turns tiered storage on for every topic of a
            Managed Kafka cluster that doesn't choose otherwise.
          type: boolean
        tieredStorageAvailable:
          description: Whether tiered storage is available on this cluster. Artie
            turns it on once the cluster's brokers have tiered storage.
          type: boolean
        tieredStorageSyncedAt:
          description: When the sync last made a Managed Kafka cluster's topics match
            the tiered storage choice for each. Missing until its first run.
          format: date-time
          type: string
        updatedAt:
          description: When the cluster row last changed. A deploying cluster can
            be retried 20 minutes after this.
          format: date-time
          type: string
        usesScram:
          description: Whether a BYOC cluster has a SASL listener, so clients log
            in with SCRAM usernames and passwords. Always false for Managed clusters,
            whose clients still log in with SCRAM-SHA-512 over SASL_SSL.
          type: boolean
        uuid:
          description: The cluster's ID, which every other Kafka cluster endpoint
            takes.
          format: uuid
          type: string
      required:
      - uuid
      - name
      - createdAt
      - updatedAt
      - status
      - externalBootstrapURL
      - usesScram
      - disableTLS
      - cloud
      - region
      - tieredStorageAvailable
      - isManaged
      - tierAllTopics
      type: object
    PayloadsKafkaClusterBrokerSettings:
      properties:
        retentionMS:
          description: How long topics keep messages unless they set their own retention.ms,
            in ms (the brokers' log.retention.ms). -1 keeps them forever.
          format: int64
          type: integer
      required:
      - retentionMS
      type: object
    PayloadsKafkaClusterChange:
      properties:
        field:
          description: The setting the change is to. The other fields already show
            its new value.
          enum:
          - allowedCIDRs
          - storageGiB
          - brokers
          - instanceType
          - tieredStorage
          - brokerSettings
          type: string
        startedAt:
          description: When the change was saved.
          format: date-time
          type: string
        state:
          description: 'Applying until the apply''s time limit after the save has
            passed (15 minutes plus a broker roll per broker, plus 5 minutes), then
            failed: the apply failed or was lost. Saving the same value again retries
            it.'
          enum:
          - applying
          - failed
          type: string
        summary:
          description: What the change does, as the Activity feed says it, such as
            "Grew broker storage from 50 GiB to 80 GiB".
          type: string
      required:
      - state
      - field
      - summary
      - startedAt
      type: object
    PayloadsKafkaClusterManaged:
      properties:
        allowedCIDRs:
          description: Client IP ranges allowed to reach the cluster. Empty when any
            IP can connect.
          items:
            type: string
          type: array
        brokerConfigs:
          description: The broker config Artie sets on top of Kafka's defaults, sorted
            by name.
          items:
            $ref: '#/components/schemas/PayloadsKafkaBrokerConfig'
          type: array
        brokerSettings:
          $ref: '#/components/schemas/PayloadsKafkaClusterBrokerSettings'
          description: The broker settings customers can change.
        brokers:
          description: How many brokers the cluster runs.
          type: integer
        instanceType:
          description: The instance type each broker runs on.
          type: string
        kafkaVersion:
          description: The Kafka version the brokers run.
          type: string
        pendingChange:
          $ref: '#/components/schemas/PayloadsKafkaClusterChange'
          description: The cluster's latest change that isn't applied yet. Missing
            once every change is applied, and while the cluster isn't active.
        storageGiB:
          description: Disk per broker in GiB.
          type: integer
      required:
      - brokers
      - instanceType
      - storageGiB
      - allowedCIDRs
      - kafkaVersion
      - brokerSettings
      - brokerConfigs
      type: object
    PayloadsKafkaClusterRates:
      properties:
        cluster:
          $ref: '#/components/schemas/PayloadsKafkaClusterRatesCluster'
          description: Traffic for the whole cluster.
        groups:
          description: Each consumer group's lag per topic it reads.
          items:
            $ref: '#/components/schemas/PayloadsKafkaClusterRatesGroupLag'
          type: array
        seriesStepSeconds:
          description: Seconds between two points of the topic and lag series. A point's
            rate times this is how many messages it covers.
          type: integer
        topics:
          description: Each topic's incoming message rate.
          items:
            $ref: '#/components/schemas/PayloadsKafkaClusterRatesTopic'
          type: array
      required:
      - cluster
      - topics
      - groups
      - seriesStepSeconds
      type: object
    PayloadsKafkaClusterRatesCluster:
      properties:
        bytesInPerSecond:
          description: Bytes written per second, averaged over the last 5 minutes.
            Null when Datadog has no data.
          type:
          - "null"
          - number
        bytesInSeries:
          description: Bytes written per second over the last 15 minutes, one point
            a minute. Empty when Datadog has no data.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphPoint'
          type: array
        bytesOutPerSecond:
          description: Bytes read per second, averaged over the last 5 minutes. Null
            when Datadog has no data.
          type:
          - "null"
          - number
        bytesOutSeries:
          description: Bytes read per second over the last 15 minutes, one point a
            minute. Empty when Datadog has no data.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphPoint'
          type: array
        messagesInPerSecond:
          description: Messages written per second, averaged over the last 5 minutes.
            Null when Datadog has no data.
          type:
          - "null"
          - number
      required:
      - messagesInPerSecond
      - bytesInPerSecond
      - bytesOutPerSecond
      - bytesInSeries
      - bytesOutSeries
      type: object
    PayloadsKafkaClusterRatesGroupLag:
      properties:
        group:
          description: The consumer group ID.
          type: string
        lag:
          description: Messages the group is behind on the topic, summed over its
            partitions, over the requested range.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphPoint'
          type: array
        readPerSecond:
          description: 'Estimated messages the group reads per second: the topic''s
            incoming rate minus how fast the lag grew over the last 5 minutes (not
            the lag series here), at least 0. Null with fewer than two lag points,
            or when Datadog returns no topic message rates.'
          type:
          - "null"
          - number
        topic:
          description: The topic the group reads.
          type: string
      required:
      - group
      - topic
      - lag
      - readPerSecond
      type: object
    PayloadsKafkaClusterRatesTopic:
      properties:
        messagesInPerSecond:
          description: Messages written to the topic per second, averaged over the
            last 5 minutes. Null when Datadog has no data, which usually means the
            topic had no writes in that window.
          type:
          - "null"
          - number
        messagesInSeries:
          description: 'Messages written per second over the requested range: a point
            a minute over 1h, every 2 minutes over 6h.'
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphPoint'
          type: array
        topic:
          description: The topic name.
          type: string
      required:
      - topic
      - messagesInPerSecond
      - messagesInSeries
      type: object
    PayloadsKafkaClusterStorageAutoscale:
      properties:
        bumpAtPercent:
          description: How full, in %, a broker's disk gets before every broker's
            disk grows. At most 99. Defaults to 65.
          maximum: 99
          minimum: 1
          type: integer
        enabled:
          description: Whether Artie grows the brokers' disks before they fill.
          type: boolean
        maxGiB:
          description: The most disk per broker, in GiB, a grow goes to. Null is no
            limit.
          minimum: 1
          type:
          - "null"
          - integer
        targetPercent:
          description: How full, in %, the fullest broker's disk is after a grow.
            Less than bumpAtPercent. Defaults to 55.
          maximum: 98
          minimum: 1
          type: integer
      required:
      - enabled
      - bumpAtPercent
      - targetPercent
      type: object
    PayloadsKafkaClusterSummary:
      properties:
        consumerGroupCount:
          description: How many consumer groups the cluster has.
          type: integer
        topicCount:
          description: How many topics the cluster has. On a Managed cluster, its
            own topics (__* and strimzi.cruisecontrol.*) aren't counted.
          type: integer
      required:
      - topicCount
      - consumerGroupCount
      type: object
    PayloadsKafkaConsumerGroup:
      properties:
        groupID:
          description: The consumer group ID, which the consumer group detail endpoint
            takes.
          type: string
      required:
      - groupID
      type: object
    PayloadsKafkaConsumerGroupDetail:
      properties:
        consumerCount:
          description: How many consumers are in the group.
          type: integer
        groupID:
          description: The consumer group ID.
          type: string
        members:
          description: The group's consumers. Left out when it has none.
          items:
            $ref: '#/components/schemas/PayloadsKafkaConsumerGroupMember'
          type: array
        readAt:
          description: When the group's offsets were read. A partition's time behind
            is this minus its committedMessageTimestamp.
          format: date-time
          type: string
        state:
          description: The group's state as Kafka reports it, such as Stable or Empty.
          type: string
        topics:
          description: Each topic the group has offsets for, sorted by name.
          items:
            $ref: '#/components/schemas/PayloadsKafkaConsumerGroupTopic'
          type:
          - array
          - "null"
      required:
      - groupID
      - consumerCount
      - state
      - topics
      - readAt
      type: object
    PayloadsKafkaConsumerGroupMember:
      properties:
        clientHost:
          description: The IP address the consumer connected from.
          type: string
        clientID:
          description: The client ID the consumer connected with.
          type: string
      required:
      - clientID
      - clientHost
      type: object
    PayloadsKafkaConsumerGroupTopic:
      properties:
        partitions:
          description: The group's offsets on each partition, sorted by partition.
          items:
            $ref: '#/components/schemas/PayloadsKafkaConsumerGroupTopicPartition'
          type:
          - array
          - "null"
        topic:
          description: The topic name.
          type: string
      required:
      - topic
      - partitions
      type: object
    PayloadsKafkaConsumerGroupTopicPartition:
      properties:
        committedMessageTimestamp:
          description: When the oldest message the group hasn't read was written.
            Only set by the single consumer group read on a Managed Kafka cluster,
            for partitions with lag, and only the 50 with the most lag. Also unset
            when reading the message failed.
          format: date-time
          type: string
        currentOffset:
          description: 'The group''s committed offset: the next message it will read.
            Partitions without a committed offset are left out.'
          format: int64
          type: integer
        lag:
          description: How many messages the group is behind on the partition.
          format: int64
          type: integer
        logEndOffset:
          description: The offset the next message written to the partition gets.
          format: int64
          type: integer
        partition:
          description: The partition ID.
          type: integer
      required:
      - partition
      - currentOffset
      - logEndOffset
      - lag
      type: object
    PayloadsKafkaInstanceType:
      enum:
      - m8g.2xlarge
      - m8g.4xlarge
      - m8g.xlarge
      - m8i.2xlarge
      - m8i.4xlarge
      - m8i.xlarge
      - r8g.2xlarge
      - r8g.large
      - r8g.xlarge
      - r8i.2xlarge
      - r8i.large
      - r8i.xlarge
      type: string
    PayloadsKafkaMessage:
      properties:
        headers:
          additionalProperties:
            format: base64
            type: string
          description: The message headers, with each value base64-encoded.
          type:
          - object
          - "null"
        key:
          description: The message key, base64-encoded. Null when the message has
            no key.
          format: base64
          type:
          - string
          - "null"
        offset:
          description: The message's offset in its partition.
          format: int64
          type: integer
        partition:
          description: The partition the message is in.
          type: integer
        timestamp:
          description: The message's Kafka timestamp.
          format: date-time
          type: string
        topic:
          description: The topic the message is in.
          type: string
        value:
          description: The message value, base64-encoded. Null for a tombstone.
          format: base64
          type:
          - string
          - "null"
      required:
      - topic
      - partition
      - offset
      - timestamp
      type: object
    PayloadsKafkaMetricsGraph:
      properties:
        brokerCount:
          description: How many brokers reported in, over time.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphSeries'
          type:
          - array
          - "null"
        cpuSystem:
          description: CPU each broker pod spent in kernel mode, over time, one series
            per broker. From Datadog's kubernetes.cpu.system.total.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphSeries'
          type:
          - array
          - "null"
        cpuUser:
          description: CPU each broker pod spent in user mode, over time, one series
            per broker. From Datadog's kubernetes.cpu.user.total.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphSeries'
          type:
          - array
          - "null"
        memoryUsage:
          description: Memory each broker pod used, in bytes, over time, one series
            per broker.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphSeries'
          type:
          - array
          - "null"
        partitionCount:
          description: How many partitions each broker hosts, over time, one series
            per broker.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphSeries'
          type:
          - array
          - "null"
        reason:
          description: Why metrics aren't available. Only set when supported is false.
          type: string
        supported:
          description: Whether metrics are available for this cluster. When false,
            reason says why and every series is empty.
          type: boolean
        topicCount:
          description: How many topics the cluster has, over time.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphSeries'
          type:
          - array
          - "null"
        unit:
          description: The unit of the broker, topic and partition count series.
          type: string
      required:
      - supported
      - unit
      - brokerCount
      - topicCount
      - partitionCount
      - cpuUser
      - cpuSystem
      - memoryUsage
      type: object
    PayloadsKafkaMetricsGraphPoint:
      properties:
        timestamp:
          description: When the value was measured.
          format: date-time
          type: string
        value:
          description: The measured value.
          format: double
          type: number
      required:
      - timestamp
      - value
      type: object
    PayloadsKafkaMetricsGraphSeries:
      properties:
        label:
          description: What the line is, such as Brokers, Topics or Broker 1.
          type: string
        points:
          description: The series values, oldest first.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMetricsGraphPoint'
          type:
          - array
          - "null"
      required:
      - label
      - points
      type: object
    PayloadsKafkaStorageGraph:
      properties:
        reason:
          description: Why storage usage isn't available. Only set when supported
            is false.
          type: string
        series:
          description: 'Disk usage over time, one series per volume: only broker volumes
            on a Managed Kafka cluster, every volume Datadog reports for the cluster
            otherwise.'
          items:
            $ref: '#/components/schemas/PayloadsKafkaStorageGraphSeries'
          type:
          - array
          - "null"
        supported:
          description: Whether storage usage is available for this cluster. When false,
            reason says why and series is empty.
          type: boolean
        threshold:
          description: The disk usage percent the dashboard marks as the limit.
          type: integer
        unit:
          description: The unit of the series values, the percent of each volume's
            capacity in use.
          type: string
      required:
      - supported
      - unit
      - threshold
      - series
      type: object
    PayloadsKafkaStorageGraphPoint:
      properties:
        timestamp:
          description: When the value was measured.
          format: date-time
          type: string
        value:
          description: Percent of the volume's capacity in use.
          format: double
          type: number
      required:
      - timestamp
      - value
      type: object
    PayloadsKafkaStorageGraphSeries:
      properties:
        label:
          description: The volume's persistent volume claim name.
          type: string
        points:
          description: The volume's usage over time, oldest first.
          items:
            $ref: '#/components/schemas/PayloadsKafkaStorageGraphPoint'
          type:
          - array
          - "null"
      required:
      - label
      - points
      type: object
    PayloadsKafkaTopic:
      properties:
        artieManaged:
          description: 'Whether Artie manages this topic: a CDC topic under the company
            prefix outside the customer namespace, or a Kafka-internal __ topic.'
          type: boolean
        localRetentionMS:
          description: How long a tiered topic keeps data on broker disks (local.retention.ms).
            -2 means the same as retention. Left out when the brokers don't report
            it.
          type: string
        partitionCount:
          description: How many partitions the topic has.
          type: integer
        retentionMS:
          description: How long the topic keeps messages, in ms, as a string (retention.ms).
            -1 keeps them forever.
          type: string
        sourceName:
          description: The name of the source reader that writes the topic. Empty
            unless the topic belongs to one of the company's Artie pipelines.
          type: string
        tableName:
          description: The source table whose changes the topic carries. Empty unless
            the topic belongs to one of the company's Artie pipelines.
          type: string
        tieredStorage:
          $ref: '#/components/schemas/PayloadsKafkaTopicTieredStorage'
          description: The topic's tiered storage state.
        topic:
          description: The topic name, which the topic endpoints take.
          type: string
      required:
      - topic
      - retentionMS
      - partitionCount
      - artieManaged
      - tieredStorage
      type: object
    PayloadsKafkaTopicCreateResponse:
      properties:
        topic:
          description: The name of the topic created.
          type: string
      required:
      - topic
      type: object
    PayloadsKafkaTopicDetail:
      properties:
        managed:
          $ref: '#/components/schemas/PayloadsKafkaTopicDetailManaged'
          description: The topic's replication and per-partition leader and offsets.
        partitionSizes:
          description: Each partition's size on broker disks, by partition.
          items:
            $ref: '#/components/schemas/PayloadsKafkaTopicPartitionSize'
          type:
          - array
          - "null"
        pipelines:
          description: Every company pipeline on the source reader that writes the
            topic, not only the ones that read this topic. Empty for topics Artie
            doesn't write.
          items:
            $ref: '#/components/schemas/PayloadsKafkaTopicPipeline'
          type:
          - array
          - "null"
        topic:
          $ref: '#/components/schemas/PayloadsKafkaTopic'
          description: The topic, as in the topic list.
      required:
      - topic
      - partitionSizes
      - pipelines
      type: object
    PayloadsKafkaTopicDetailManaged:
      properties:
        partitions:
          description: Each partition's leader, in-sync copies and latest offset.
          items:
            $ref: '#/components/schemas/PayloadsKafkaTopicPartition'
          type: array
        replicationFactor:
          description: How many copies of each partition the brokers keep.
          type: integer
      required:
      - replicationFactor
      - partitions
      type: object
    PayloadsKafkaTopicMessages:
      properties:
        latestOffsets:
          additionalProperties:
            format: int64
            type: integer
          description: Each partition's highest offset seen, by partition ID. To get
            newer messages, pass it back as after in partition:offset,... form.
          type: object
        messages:
          description: The newest messages across the topic's partitions, newest first.
          items:
            $ref: '#/components/schemas/PayloadsKafkaMessage'
          type: array
      required:
      - messages
      - latestOffsets
      type: object
    PayloadsKafkaTopicPartition:
      properties:
        inSyncCount:
          description: How many copies are caught up with the leader, the leader included.
          type: integer
        latestOffset:
          description: The offset the next message gets. Missing when the brokers
            didn't answer for it.
          type: integer
        leaderID:
          description: The broker that serves the partition. Missing while it has
            no leader, except that a leaderless partition whose last in-sync copy
            was broker 0 still shows 0.
          type: integer
        partition:
          description: The partition ID.
          type: integer
      required:
      - partition
      - inSyncCount
      type: object
    PayloadsKafkaTopicPartitionSize:
      properties:
        partition:
          description: The partition ID.
          format: int32
          type: integer
        sizeBytes:
          description: The partition's size on disk, in bytes, from its largest copy.
          format: int64
          type: integer
      required:
      - partition
      - sizeBytes
      type: object
    PayloadsKafkaTopicPipeline:
      properties:
        name:
          description: The pipeline's name.
          type: string
        uuid:
          description: The pipeline's ID.
          type: string
      required:
      - uuid
      - name
      type: object
    PayloadsKafkaTopicSize:
      properties:
        partitions:
          description: Each partition's size on broker disks, by partition.
          items:
            $ref: '#/components/schemas/PayloadsKafkaTopicPartitionSize'
          type:
          - array
          - "null"
        remoteSizeBytes:
          description: The topic's size in remote storage (S3). Missing when Datadog
            has no data for it.
          type:
          - "null"
          - integer
        topic:
          description: The topic name.
          type: string
      required:
      - topic
      - partitions
      type: object
    PayloadsKafkaTopicTieredStorage:
      properties:
        canTier:
          description: Whether tiered storage can be on for this topic. Kafka refuses
            it on compacted topics, and Artie keeps it off Kafka's and Cruise Control's
            own topics and topics whose retention can't be read.
          type: boolean
        state:
          $ref: '#/components/schemas/EnumsKafkaTopicTieredStorageState'
          description: off, on or paused, from the topic's remote.storage.enable and
            remote.log.copy.disable configs.
        switchOn:
          description: Whether the topic's tiered storage switch is on. On a Managed
            Kafka cluster it's the topic's own switch, else the cluster's tierAllTopics;
            elsewhere it's whether the topic is tiered (on or paused).
          type: boolean
      required:
      - state
      - canTier
      - switchOn
      type: object
    PayloadsKafkaUser:
      properties:
        accessProfile:
          description: 'What the user can do: producer_consumer or admin.'
          type: string
        consumerGroupPrefix:
          description: The prefix a producer_consumer user's consumer group IDs must
            start with to read. Admin users can read any group.
          type: string
        createdAt:
          description: When the user was created.
          format: date-time
          type: string
        status:
          description: pending until the user is ready, then active; deleting while
            it's being removed.
          type: string
        username:
          description: The Kafka username clients log in with.
          type: string
        uuid:
          description: The user's ID, which the user endpoints take.
          format: uuid
          type: string
      required:
      - uuid
      - username
      - accessProfile
      - status
      - createdAt
      - consumerGroupPrefix
      type: object
    PayloadsKafkaUserACL:
      properties:
        name:
          description: Empty for the cluster, which is one resource.
          type: string
        operation:
          $ref: '#/components/schemas/EnumsKafkaACLOperation'
          description: The operation the ACL allows.
        patternType:
          $ref: '#/components/schemas/EnumsKafkaACLPatternType'
          description: literal matches name exactly, and "*" is every name; prefix
            matches names starting with it.
        resourceType:
          $ref: '#/components/schemas/EnumsKafkaACLResourceType'
          description: The kind of Kafka resource the ACL covers.
      required:
      - resourceType
      - patternType
      - name
      - operation
      type: object
    PayloadsLightConnector:
      properties:
        companyUUID:
          description: The company that owns the connector.
          format: uuid
          type: string
        connectionLabel:
          description: A short summary of where the connector points, such as its
            host, built from the config. Empty if the config is incomplete.
          type: string
        createdAt:
          description: When the connector was created.
          format: date-time
          type: string
        dataPlaneName:
          description: The data plane that connects to this database. Unset means
            the company's default data plane.
          type:
          - "null"
          - string
        draftPipelineUUID:
          description: The draft pipeline this connector was created for. Unset once
            a pipeline or source reader past draft uses it.
          format: uuid
          type:
          - "null"
          - string
        environmentUUID:
          description: The environment the connector belongs to.
          format: uuid
          type: string
        isValid:
          description: Whether the saved config passes validation, such as having
            every required field.
          type: boolean
        label:
          description: 'Display name: the connector''s name, or for an unnamed Snowflake
            connector its type and account.'
          type: string
        privateLinkUUID:
          description: The PrivateLink connection used to reach the database, if any.
            Its DNS entry replaces the configured host.
          format: uuid
          type:
          - "null"
          - string
        snapshotPrivateLinkUUID:
          description: The PrivateLink connection used to reach the snapshot (read
            replica) host, if any.
          format: uuid
          type:
          - "null"
          - string
        sshTunnelUUID:
          description: The SSH tunnel used to reach the database, if any.
          format: uuid
          type:
          - "null"
          - string
        type:
          $ref: '#/components/schemas/EnumsConnectorSlug'
          description: The connector type.
        updatedAt:
          description: When the connector was last changed.
          format: date-time
          type: string
        uuid:
          description: The connector's UUID, used as {uuid} in the connector_* tools.
          format: uuid
          type: string
      required:
      - label
      - uuid
      - createdAt
      - updatedAt
      - type
      - companyUUID
      - environmentUUID
      - isValid
      type: object
    PayloadsLightPipeline:
      properties:
        backfillStages:
          description: The latest backfill stage of each regular table that recorded
            one. Can be stale once a table stops backfilling; read with hasBackfillingTables.
          items:
            $ref: '#/components/schemas/PayloadsBackfillStageEvent'
          type: array
        columnHashingSaltUUID:
          description: UUID of the salt used to hash columnsToHash, if any.
          format: uuid
          type:
          - "null"
          - string
        companyUUID:
          description: UUID of the company that owns the pipeline.
          format: uuid
          type: string
        createdAt:
          description: When the pipeline was created, in RFC 3339.
          format: date-time
          type: string
        dataPlaneName:
          description: Name of the data plane the pipeline runs on.
          type: string
        destinationUUID:
          description: UUID of the destination connector.
          format: uuid
          type:
          - "null"
          - string
        encryptionKeyUUID:
          description: UUID of the encryption key used for columnsToEncrypt, if any.
          format: uuid
          type:
          - "null"
          - string
        environmentUUID:
          description: UUID of the environment the pipeline belongs to.
          format: uuid
          type: string
        hasBackfillingTables:
          description: True when one or more tables are in their initial backfill.
          type: boolean
        hasUndeployedChanges:
          description: True when the pipeline has saved changes that haven't been
            deployed.
          type: boolean
        historyBackfillStages:
          description: The latest backfill stage of each history table that recorded
            one. Can be stale once a table stops backfilling; read with hasBackfillingTables.
          items:
            $ref: '#/components/schemas/PayloadsBackfillStageEvent'
          type: array
        isDeploying:
          description: True while a deploy of the pipeline is in progress.
          type: boolean
        lastDeployError:
          description: Why the last deploy failed. Cleared once a later deploy succeeds.
          type: string
        lastDeployFailedAt:
          description: When the last deploy failed, in RFC 3339. Cleared once a later
            deploy succeeds.
          format: date-time
          type:
          - "null"
          - string
        lastDeployedAt:
          description: When the pipeline was last deployed, in RFC 3339. Omitted if
            it never was.
          format: date-time
          type:
          - "null"
          - string
        lastUpdatedAt:
          description: When the pipeline was last saved, in RFC 3339.
          format: date-time
          type: string
        name:
          description: The pipeline's display name.
          type: string
        snowflakeEcoScheduleUUID:
          description: UUID of the Snowflake eco schedule the pipeline uses, if any.
          format: uuid
          type:
          - "null"
          - string
        sourceReaderUUID:
          description: UUID of the source reader the pipeline reads from, for source_reader_detail.
          format: uuid
          type: string
        sourceType:
          $ref: '#/components/schemas/EnumsConnectorSlug'
          description: The source connector's type.
        status:
          $ref: '#/components/schemas/EnumsPipelineStatus'
          description: The pipeline's run state.
        uuid:
          description: The pipeline's UUID.
          format: uuid
          type: string
      required:
      - uuid
      - companyUUID
      - dataPlaneName
      - environmentUUID
      - name
      - createdAt
      - lastUpdatedAt
      - isDeploying
      - sourceType
      - hasUndeployedChanges
      type: object
    PayloadsManagedKafkaUser:
      properties:
        acls:
          description: What the user is allowed. Kafka refuses it everything else.
          items:
            $ref: '#/components/schemas/PayloadsKafkaUserACL'
          type: array
        createdAt:
          description: When the user was created.
          format: date-time
          type: string
        username:
          description: The Kafka username clients log in with.
          type: string
        uuid:
          description: The user's ID, which the managed user endpoints take.
          format: uuid
          type: string
      required:
      - uuid
      - username
      - acls
      - createdAt
      type: object
    PayloadsMergePredicates:
      properties:
        partitionBy:
          description: 'BigQuery time partitions only: hourly, daily, monthly or yearly;
            empty means daily. Not allowed with an integer partitionType.'
          type: string
        partitionField:
          description: The destination column Transfer adds to its MERGE condition,
            usually the table's partition column.
          type: string
        partitionType:
          description: 'time or integer. Only BigQuery reads it: time also partitions
            the table by partitionBy, and integer only adds the column to the MERGE.'
          type: string
      type: object
    PayloadsPartitionRangeSettings:
      properties:
        enabled:
          description: When true, a partitioned Postgres table is backfilled by reading
            each of its partitions.
          type: boolean
        range:
          $ref: '#/components/schemas/PayloadsRangeSettings'
          description: Range settings for each partition's backfill.
      type: object
    PayloadsPhysicalCTIDRangeSettings:
      properties:
        pagesPerRange:
          description: Heap pages in each CTID range; 0 derives the width from chunkSize.
          minimum: 0
          type: integer
      type: object
    PayloadsPipelineAdvancedSettings:
      properties:
        appendOnly:
          description: When true, rows are always appended instead of merged into
            the destination table. Use for append-only data such as event tracking.
          type: boolean
        artieUpdatedAtColumnName:
          description: 'Name for the column includeArtieUpdatedAtColumn adds, instead
            of __artie_updated_at. Always lowercase, as every column name is written.
            To change it, pause the pipeline and rename the column in the destination
            tables before resuming: Artie doesn''t rename columns in tables it already
            created. Not supported for ClickHouse.'
          type: string
        autoEnableHistoryForNewTables:
          description: When true, new source tables are added with history mode on;
            without autoReplicateNewTables they are added history-only.
          type: boolean
        autoEnableHistoryIgnoreRegex:
          description: Regex of full table names that are skipped while autoEnableHistoryForNewTables
            is on. Can't be combined with autoEnableHistoryIncludeRegex.
          type: string
        autoEnableHistoryIncludeRegex:
          description: Regex of full table names; while autoEnableHistoryForNewTables
            is on, only new tables that match are auto-added. Can't be combined with
            autoEnableHistoryIgnoreRegex.
          type: string
        autoReplicateIgnoreRegex:
          description: Regex of full table names that auto-replication skips. Can't
            be combined with autoReplicateIncludeRegex.
          type: string
        autoReplicateIncludeRegex:
          description: Regex of full table names; only new tables that match are auto-added.
            Can't be combined with autoReplicateIgnoreRegex.
          type: string
        autoReplicateNewTables:
          description: When true, new tables found in the source are added to the
            pipeline automatically.
          type: boolean
        autoStopDroppedTables:
          description: When true, tables that no longer exist in the source stop streaming
            automatically. Destination tables and their data are kept. On sources
            other than Postgres, a table Artie lost access to also counts as dropped.
          type: boolean
        backfillMySQLFloatsAsShortestDecimal:
          description: 'MySQL and PlanetScale sources only: backfills write FLOAT
            columns as their shortest decimal, as replication does, instead of the
            exact float32.'
          type: boolean
        bigQueryReservation:
          description: 'BigQuery only: the reservation Transfer''s queries run in;
            empty uses the project default.'
          type: string
        bufferRows:
          description: Rows to buffer before flushing to the destination, at least
            5.
          type: integer
        castAllColumnsToString:
          description: 'MongoDB and DocumentDB sources only: write every column, including
            the primary key, as a string. __artie_* columns keep their types.'
          type: boolean
        databricksAutoLiquidClustering:
          description: 'Databricks only: turn on automatic liquid clustering for every
            destination table.'
          type: boolean
        databricksDisableVariantShredding:
          description: 'Databricks only: turn off variant shredding on new tables
            and, after each deploy, existing ones. Already shredded data isn''t rewritten.'
          type: boolean
        databricksUseZerobus:
          description: 'Databricks only: append to history tables and appendOnly tables
            through Zerobus Ingest instead of COPY INTO. Needs a connector that signs
            in with a service principal (OAuth M2M) and databricksZerobusEndpoint.'
          type: boolean
        databricksZerobusEndpoint:
          description: 'Databricks only: the workspace''s Zerobus endpoint, https://<workspace
            id>.zerobus.<region>.cloud.databricks.com. Required when databricksUseZerobus
            is on.'
          type: string
        defaultSourceSchema:
          description: Source schema whose tables aren't prefixed with the schema
            name in the destination.
          type: string
        disableAlerts:
          description: When true, Artie stops sending email alerts for this pipeline.
            Health is still tracked in the dashboard.
          type: boolean
        dropDeletedColumns:
          description: When true, columns dropped in the source are dropped in the
            destination too. History tables never drop columns.
          type: boolean
        dynamoDBBackfillConfig:
          $ref: '#/components/schemas/PayloadsDynamoDBSnapshotConfig'
          description: 'DynamoDB sources only: how backfills read the table from a
            DynamoDB export to S3.'
        enableSoftDelete:
          description: When true, rows deleted in the source are kept and marked in
            an __artie_delete column instead of being deleted.
          type: boolean
        flushIntervalSeconds:
          description: Seconds between flushes to the destination, from 5 to 86400.
            Transfer flushes sooner when bufferRows or flushSizeKb is reached.
          type: integer
        flushSizeKb:
          description: Buffered data, in KB, that triggers a flush to the destination,
            up to 1.5 GB.
          type: integer
        forceUTCTimezone:
          description: When true, source timestamp columns without a time zone are
            written as UTC timestamps with a time zone.
          type: boolean
        includeArtieOperationColumn:
          description: When true, each row gets an __artie_operation column with the
            change type that wrote it.
          type: boolean
        includeArtieUpdatedAtColumn:
          description: When true, each row gets an __artie_updated_at column with
            the time Artie wrote it.
          type: boolean
        includeDatabaseUpdatedAtColumn:
          description: When true, each row gets an __artie_db_updated_at column with
            the time the change happened in the source. Always on for history tables.
          type: boolean
        includeFullSourceTableNameColumn:
          description: When true, each row gets an __artie_full_source_table_name
            column with its source table's full name.
          type: boolean
        includeFullSourceTableNameColumnAsPrimaryKey:
          description: When true, the __artie_full_source_table_name column is added
            to the primary key. Requires includeFullSourceTableNameColumn.
          type: boolean
        includeSourceMetadataColumn:
          description: When true, each row gets an __artie_source_metadata column
            with the change's source metadata.
          type: boolean
        jsonAsVarchar:
          description: 'Redshift only: store struct values as JSON text in VARCHAR(MAX)
            instead of SUPER.'
          type: boolean
        jsonParseTruncateStrings:
          description: 'Redshift only: truncate strings inside SUPER values that are
            over Redshift''s limit instead of failing the load.'
          type: boolean
        maxConcurrentSnapshots:
          description: Most table backfills this pipeline runs at once; 0 uses the
            company limit, and a set value must be between 1 and that limit.
          minimum: 0
          type: integer
        nullOutInvalidValues:
          description: 'Snowflake and BigQuery only: skip invalid values, such as
            bad timestamps, instead of failing the load. Set by Artie.'
          type: boolean
        postgresPartitionMirroring:
          description: 'Postgres source and destination only: create each partitioned
            source table''s partitions in the destination, including ones added later.'
          type: boolean
        reuseStagingTable:
          description: When true, Transfer truncates and reuses staging tables instead
            of dropping them. Set by Artie.
          type: boolean
        snowpipeStreamingMaxChannels:
          description: 'Snowflake only: the most Snowpipe Streaming channels Transfer
            opens.'
          type: integer
        splitEventsByType:
          description: 'API sources only: when true, each event type gets its own
            table; when false, all events share one table with the event type as a
            column.'
          type: boolean
        stagingSchema:
          description: Schema to create staging tables in; empty uses each table's
            own schema.
          type: string
        staticColumns:
          description: Columns with fixed values added to every destination table.
          items:
            $ref: '#/components/schemas/PayloadsStaticColumn'
          type:
          - array
          - "null"
        structAsVariant:
          description: 'Databricks only: store new struct and array columns as VARIANT
            instead of STRING or ARRAY<string>.'
          type: boolean
        truncateExceededValues:
          description: 'Redshift and BigQuery only: truncate values that are too large
            for their column instead of replacing them with __artie_exceeded_value.'
          type: boolean
        turboLatencyThresholdMinutes:
          description: 'Snowflake Turbo Mode: ingestion lag, in minutes, that must
            be exceeded to switch to turboWarehouse. Defaults to 30.'
          type: integer
        turboRowThreshold:
          description: 'Snowflake Turbo Mode: row lag that must be exceeded to switch
            to turboWarehouse. Defaults to 5,000,000.'
          type: integer
        turboWarehouse:
          description: 'Snowflake only: a larger warehouse Turbo Mode switches to
            while the pipeline is behind.'
          type: string
        useBQBatchPriority:
          description: 'BigQuery only: run Transfer''s queries with batch priority
            instead of interactive.'
          type: boolean
        useBigNumericForVariableNumeric:
          description: 'BigQuery only: write variable-precision numeric columns as
            BIGNUMERIC.'
          type: boolean
        useDoubleForVariableNumeric:
          description: 'MotherDuck only: write variable-precision numeric columns
            as DOUBLE.'
          type: boolean
        useNewStringMethod:
          description: 'Databricks only: use Transfer''s newer string conversion;
            omitted uses the company setting.'
          type:
          - "null"
          - boolean
        useSnowpipeStreaming:
          description: 'Snowflake only: load data with Snowpipe Streaming.'
          type: boolean
        writeRawBinaryValues:
          description: 'Databricks and MSSQL only: write binary values as raw binary
            instead of Base64-encoded strings.'
          type: boolean
      type: object
    PayloadsPipelineErrorLog:
      properties:
        createdAt:
          description: When Artie recorded the error, in RFC 3339.
          format: date-time
          type: string
        database:
          description: The database of the table the error is about, if any.
          type: string
        destination:
          description: The destination connector type, such as bigquery.
          type: string
        errorDetail:
          description: The full error text, with secrets redacted.
          type: string
        eventType:
          description: The type of the event that reported the error.
          type: string
        message:
          description: A short summary of the event type.
          type: string
        mode:
          description: 'Transfer''s run mode when the error happened: replication
            or history.'
          type: string
        pipelineUUID:
          description: UUID of the pipeline the error belongs to.
          format: uuid
          type: string
        schema:
          description: The schema of the table the error is about, if any.
          type: string
        service:
          description: The Artie service that reported the error, such as transfer
            or reader.
          type: string
        source:
          description: The source connector type, such as postgresql.
          type: string
        sourceReaderUUID:
          description: UUID of the pipeline's source reader.
          format: uuid
          type: string
        table:
          description: The table the error is about, if any.
          type: string
        timestamp:
          description: When the service reported the error, in RFC 3339.
          format: date-time
          type:
          - "null"
          - string
        uuid:
          description: The error log entry's UUID.
          format: uuid
          type: string
        version:
          description: The version of the service that reported the error.
          type: string
      required:
      - uuid
      type: object
    PayloadsPipelinePayload:
      properties:
        advancedSettings:
          $ref: '#/components/schemas/PayloadsAdvancedPipelineSettingsPayload'
          description: Pipeline settings to change; omitted fields keep their current
            values.
        columnHashingSaltUUID:
          description: UUID of the salt used to hash columnsToHash; null hashes with
            plain SHA-256.
          format: uuid
          type:
          - "null"
          - string
        dataPlaneName:
          description: Name of the data plane that runs the pipeline. On create, empty
            uses the company's default data plane.
          type: string
        destinationUUID:
          description: UUID of the destination connector, from the connector list.
          format: uuid
          type:
          - "null"
          - string
        encryptionKeyUUID:
          description: UUID of the encryption key used for columnsToEncrypt; null
            for none.
          format: uuid
          type:
          - "null"
          - string
        name:
          description: The pipeline's display name.
          type: string
        snowflakeEcoScheduleUUID:
          description: UUID of a Snowflake eco schedule for the pipeline; null for
            none.
          format: uuid
          type:
          - "null"
          - string
        sourceReaderUUID:
          description: UUID of the source reader the pipeline reads from, from pipeline_detail
            or the source reader list.
          format: uuid
          type: string
        specificDestCfg:
          $ref: '#/components/schemas/PayloadsSpecificConfig'
          description: Destination-specific settings, such as the database, schema
            or bucket to write to.
        tables:
          description: The tables to replicate.
          items:
            $ref: '#/components/schemas/PayloadsTablePayload'
          type:
          - array
          - "null"
      type: object
    PayloadsPostgresPublication:
      properties:
        allTables:
          type: boolean
        name:
          type: string
        publishViaPartitionRoot:
          type: boolean
      required:
      - name
      - allTables
      - publishViaPartitionRoot
      type: object
    PayloadsPostgresReplicationSlot:
      properties:
        active:
          description: Whether a client is connected to the slot and consuming it.
          type: boolean
        database:
          description: The database the slot belongs to. Null for a physical slot.
          type:
          - "null"
          - string
        hotStandbyFeedback:
          description: The replica's hot_standby_feedback setting (on or off), which
            must be on to stream from a replica. Empty on a primary.
          type: string
        isReplica:
          description: Whether the server is a read replica. Only detected on Postgres
            16 and newer.
          type: boolean
        name:
          description: The replication slot name, to pass as slotName to connector_drop_postgres_replication_slot.
          type: string
        notFound:
          description: Whether a looked-up slot doesn't exist. Always false in a list
            of slots.
          type: boolean
        retainedWALBytes:
          description: 'Bytes of WAL the slot holds back: the distance from its restart_lsn
            to the current WAL position (the last replayed position on a replica).'
          minimum: 0
          type: integer
        walStatus:
          description: The slot's wal_status from pg_replication_slots, such as reserved,
            extended, unreserved or lost; N/A on Postgres 12 and older.
          type: string
      required:
      - name
      - database
      - notFound
      - active
      - walStatus
      - retainedWALBytes
      - isReplica
      - hotStandbyFeedback
      type: object
    PayloadsPostgresSetting:
      properties:
        category:
          description: The pg_settings category the setting belongs to.
          type: string
        description:
          description: Postgres's own explanation of the setting, from pg_settings.
          type: string
        name:
          description: The setting name, as in pg_settings.
          type: string
        unit:
          description: The value's unit, such as kB or ms. Empty for unitless settings.
          type: string
        value:
          description: The current value, in the unit given by unit.
          type: string
      required:
      - name
      - value
      - unit
      - category
      - description
      type: object
    PayloadsPostgresSettings:
      description: The source's replication-relevant settings, one per pg_settings
        row.
      items:
        $ref: '#/components/schemas/PayloadsPostgresSetting'
      type: array
    PayloadsPrivateLinkConnection:
      properties:
        approvedAt:
          description: When the connection was approved for provisioning. Left out
            while it awaits approval.
          format: date-time
          type:
          - "null"
          - string
        availabilityZoneIds:
          description: AWS availability zone IDs, such as use1-az1, that the endpoint
            is placed in. Empty on Azure.
          items:
            type: string
          type: array
        companyUUID:
          description: The company that owns the connection.
          format: uuid
          type: string
        createdAt:
          description: When the connection was created.
          format: date-time
          type: string
        createdBy:
          description: Display name of who created the connection, or API key or Artie
            for non-account actors. Only set on the list response.
          type: string
        dataPlaneName:
          description: The data plane the connection is restricted to. Left out when
            it uses the company's default data plane.
          type:
          - "null"
          - string
        dnsEntry:
          description: 'The address of Artie''s endpoint that connectors use as their
            host: a DNS name on AWS, a private IP on Azure. Empty until provisioned.'
          type: string
        environmentUUID:
          description: The environment the connection belongs to.
          format: uuid
          type: string
        name:
          description: Display name for the connection.
          type: string
        privateLinkServiceAlias:
          description: The Azure Private Link service alias Artie connects to. Empty
            on AWS.
          type: string
        provider:
          $ref: '#/components/schemas/EnumsCloudProvider'
          description: The cloud the connection is in, set by its data plane.
        provisioningError:
          description: 'The raw error that put the connection in errored status: a
            failed provisioning attempt, a health check that found the endpoint dead
            or gone, or a failed teardown. Only set while status is errored.'
          type: string
        region:
          description: 'The cloud region of the connection: parsed from the VPC service
            name on AWS, the data plane''s region on Azure.'
          type: string
        status:
          description: Where the connection is in review and provisioning.
          type: string
        updatedAt:
          description: When the connection was last changed.
          format: date-time
          type: string
        uuid:
          description: The PrivateLink connection's UUID.
          format: uuid
          type: string
        vpcEndpointId:
          description: 'The ID of Artie''s endpoint: the VPC endpoint ID on AWS, the
            private endpoint resource ID on Azure. Empty until provisioned.'
          type: string
        vpcServiceName:
          description: The AWS VPC endpoint service name Artie connects to, such as
            com.amazonaws.vpce.us-west-2.vpce-svc-<id>. Empty on Azure.
          type: string
      required:
      - uuid
      - companyUUID
      - environmentUUID
      - createdAt
      - updatedAt
      - name
      - provider
      - vpcServiceName
      - privateLinkServiceAlias
      - status
      - region
      - dnsEntry
      - availabilityZoneIds
      type: object
    PayloadsRangeSettings:
      properties:
        batchSize:
          description: Rows per backfill query; 0 uses the source reader's backfill
            batch size. Capped at 50,000 when enabled is true. Not used by partition
            range backfills.
          minimum: 0
          type: integer
        chunksSize:
          description: Width of each primary-key range, at least 100,000; 0 uses the
            reader's default.
          minimum: 0
          type: integer
        enabled:
          description: When true, the backfill splits the primary key into ranges
            and reads them in parallel.
          type: boolean
        maxParallelism:
          description: How many ranges are read at once; 0 uses the reader's default.
          minimum: 0
          type: integer
      type: object
    PayloadsS3CSVParser:
      properties:
        commentPrefix:
          description: A single character that marks a line as a comment to skip;
            empty means no comment lines. Can't be the delimiter.
          type: string
        delimiter:
          description: The single character between fields; empty means a comma.
          type: string
        headers:
          description: Column names for files without a header row, in field order.
            Empty means the first row of each file is the header.
          items:
            type: string
          type: array
        nullValues:
          description: Field values to write as null, such as NULL or an empty string.
          items:
            type: string
          type: array
        trimWhitespace:
          description: When true, leading and trailing whitespace is removed from
            each field.
          type: boolean
      type: object
    PayloadsS3Match:
      properties:
        fileNameRegex:
          description: Regex the object's file name, without its directory or compression
            suffix, must match. Empty matches every object under prefix.
          type: string
      type: object
    PayloadsS3MetadataColumns:
      properties:
        columns:
          description: Metadata columns to add, such as artieSourcePath (the object
            key), artieSourceFileName or artieSourceRecordNumber (the record's position
            in the file).
          items:
            enum:
            - artieSourcePath
            - artieSourceFileName
            - artieSourceLastModified
            - artieSourceETag
            - artieSourceRecordNumber
            - artieSourceIngestedAt
            type: string
          type: array
      type: object
    PayloadsS3Parser:
      properties:
        columnOrder:
          description: The order of the parsed columns in the destination table, after
            the metadata columns; columns not listed follow in alphabetical order.
            Must include every primaryKey column that isn't a metadata column.
          items:
            type: string
          type: array
        csv:
          $ref: '#/components/schemas/PayloadsS3CSVParser'
          description: CSV options, for the csv type.
        type:
          description: The format of the objects.
          enum:
          - csv
          - json
          - parquet
          - ach
          type: string
      required:
      - type
      type: object
    PayloadsS3PathMapping:
      properties:
        id:
          description: The mapping's checkpoint ID. Leave it empty on a new mapping
            and Artie generates one; keep it unchanged afterwards, since a new ID
            re-reads every matching object from the start.
          type: string
        match:
          $ref: '#/components/schemas/PayloadsS3Match'
          description: Narrows which objects under prefix the mapping reads.
        metadata:
          $ref: '#/components/schemas/PayloadsS3MetadataColumns'
          description: Columns about the source object to add to each record.
        parser:
          $ref: '#/components/schemas/PayloadsS3Parser'
          description: How each object's contents are parsed into records.
        prefix:
          description: The object key prefix to read, such as exports/orders/.
          type: string
        primaryKey:
          description: Columns that uniquely identify a record, used as its key. Left
            empty, the mapping needs the artieSourcePath and artieSourceRecordNumber
            metadata columns, which identify each record by file and position.
          items:
            type: string
          type: array
        referenceID:
          description: The name of the destination table the matching objects' records
            go to.
          type: string
      required:
      - id
      - referenceID
      - prefix
      - match
      - parser
      - metadata
      type: object
    PayloadsSSHTunnel:
      properties:
        companyUUID:
          description: The company that owns the tunnel.
          format: uuid
          type: string
        createdAt:
          description: When the tunnel was created.
          format: date-time
          type: string
        environmentUUID:
          description: The environment the tunnel belongs to.
          format: uuid
          type: string
        host:
          description: Hostname or IP address of the SSH bastion server Artie connects
            to.
          type: string
        isInUse:
          description: Whether any connector uses this tunnel. Only set on the detail
            response.
          type:
          - "null"
          - boolean
        name:
          description: Display name for the tunnel.
          type: string
        port:
          description: Port the SSH bastion server listens on.
          type: integer
        publicKey:
          description: The public key Artie generated for this tunnel; add it to the
            bastion user's authorized_keys. The private key is never returned.
          type: string
        updatedAt:
          description: When the tunnel was last changed.
          format: date-time
          type: string
        username:
          description: The user Artie logs in to the bastion as. Empty for callers
            who can't edit connectors.
          type: string
        uuid:
          description: The SSH tunnel's UUID. Connectors reference it to connect through
            this tunnel.
          format: uuid
          type: string
      required:
      - uuid
      - companyUUID
      - environmentUUID
      - name
      - host
      - port
      - publicKey
      - username
      type: object
    PayloadsSchemaResponse:
      properties:
        name:
          description: The schema name, to pass as schemaName to connector_fetch_tables.
          type: string
        unreadable:
          description: True when the connector's user can't use the schema (for Postgres,
            no USAGE privilege), so its tables can't be read.
          type: boolean
        unreadableReason:
          description: Why the schema is unreadable, when the source says.
          type: string
      required:
      - name
      - unreadable
      type: object
    PayloadsSeenTableColumn:
      properties:
        metadata:
          $ref: '#/components/schemas/PayloadsSeenTableColumnMetadata'
          description: The column's type and constraints.
        name:
          description: The column's name in the source table.
          type: string
      required:
      - name
      - metadata
      type: object
    PayloadsSeenTableColumnMetadata:
      properties:
        dataType:
          description: The column's data type as the source reports it.
          type: string
        defaultValue:
          description: The column's default value expression; null when it has none.
          type:
          - "null"
          - string
        isPrimaryKey:
          description: True when the column is part of the primary key; null when
            unknown.
          type:
          - "null"
          - boolean
        notNull:
          description: True when the column is declared NOT NULL.
          type: boolean
      required:
      - dataType
      - notNull
      type: object
    PayloadsSnowflakeEcoSchedule:
      properties:
        company:
          description: The UUID of the company that owns the schedule.
          format: uuid
          type: string
        createdAt:
          description: When the schedule was created.
          format: date-time
          type: string
        environmentUUID:
          description: The environment the schedule belongs to.
          format: uuid
          type: string
        name:
          description: Display name for the schedule.
          type: string
        settings:
          $ref: '#/components/schemas/PayloadsSnowflakeEcoScheduleSettings'
          description: Peak hours and the flush rules used outside them.
        updatedAt:
          description: When the schedule was last changed.
          format: date-time
          type: string
        uuid:
          description: The Snowflake Eco Mode schedule's UUID.
          format: uuid
          type: string
      required:
      - createdAt
      - updatedAt
      - uuid
      - company
      - environmentUUID
      - name
      - settings
      type: object
    PayloadsSnowflakeEcoScheduleSettings:
      properties:
        days:
          description: Days with peak hours, as English weekday names such as Monday.
            Every hour of the other days is off-peak. At least one is required.
          items:
            type: string
          type: array
        endTimeOfDay:
          description: When peak hours end each peak day, as 24-hour HH:MM.
          type: string
        offPeakBufferRows:
          description: Rows to buffer before flushing during off-peak hours.
          minimum: 5
          type: integer
        offPeakFlushIntervalSeconds:
          description: Seconds between flushes to Snowflake during off-peak hours.
          maximum: 86400
          minimum: 5
          type: integer
        offPeakFlushSizeKb:
          description: Buffered data size, in KB, that triggers a flush during off-peak
            hours; 1572864 KB is 1.5 GB.
          maximum: 1.572864e+06
          minimum: 1
          type: integer
        startTimeOfDay:
          description: When peak hours start each peak day, as 24-hour HH:MM. Must
            not be after endTimeOfDay.
          type: string
        timezone:
          description: IANA time zone the peak hours are in, such as UTC or America/New_York.
            Only common zones are accepted.
          type: string
      required:
      - timezone
      - startTimeOfDay
      - endTimeOfDay
      - days
      - offPeakFlushIntervalSeconds
      - offPeakBufferRows
      - offPeakFlushSizeKb
      type: object
    PayloadsSoftPartitioning:
      properties:
        enabled:
          description: When true, Transfer writes rows into time-based partition tables.
          type: boolean
        maxPartitions:
          description: How many partition tables to keep before older ones are merged
            into the compacted table; 0 keeps all of them.
          type: integer
        partitionColumn:
          description: The timestamp column whose value picks each row's partition.
          type: string
        partitionFrequency:
          description: 'How often a new partition table starts: monthly, daily or
            hourly.'
          type: string
        partitionSchema:
          description: Passed to Transfer, which does not use it.
          type: string
      type: object
    PayloadsSourceReader:
      properties:
        apiBaseURL:
          description: For API sources, the URL to send records to. Empty for other
            sources.
          type: string
        archiveConnectorUUID:
          description: 'SQL Server trn_log_backup only: the SMB share connector holding
            the log backups, when settings.archiveLocationType is smb_share. Sending
            archiveLocationType without it clears it.'
          format: uuid
          type:
          - "null"
          - string
        companyUUID:
          description: The company that owns the source reader.
          format: uuid
          type: string
        connectorUUID:
          description: The source connector it reads from, from connector_list with
            includeSourceConnectors=true.
          format: uuid
          type: string
        containerName:
          description: 'Oracle only: the container to connect to. Empty uses the connector''s
            CDB.'
          type: string
        createdAt:
          description: When the source reader was created.
          format: date-time
          type: string
        dataPlaneName:
          description: The data plane the reader runs in. Empty on update keeps the
            current one.
          type: string
        database:
          description: 'The database to read from: the service name for Oracle, the
            bucket for S3, the keyspace for Keyspaces.'
          type: string
        environmentUUID:
          description: The environment the source reader belongs to.
          format: uuid
          type: string
        isShared:
          description: Whether several pipelines can share this source reader.
          type:
          - "null"
          - boolean
        isValid:
          description: Whether the source reader and its connector pass validation.
          type: boolean
        name:
          description: The source reader's display name.
          type: string
        settings:
          $ref: '#/components/schemas/PayloadsSourceReaderSettingsPayload'
          description: Source-specific reader settings.
        status:
          $ref: '#/components/schemas/EnumsSourceReaderStatus'
          description: The source reader's lifecycle state.
        tablesConfig:
          $ref: '#/components/schemas/PayloadsSourceReaderTablesConfig'
          description: 'Shared source readers only: the tables it reads, keyed by
            schema.table (or the collection name for MongoDB and DocumentDB), with
            their column filters.'
        updatedAt:
          description: When the source reader was last changed.
          format: date-time
          type: string
        uuid:
          description: The source reader's UUID, from pipeline_detail.sourceReaderUUID.
          format: uuid
          type: string
      required:
      - uuid
      - name
      - companyUUID
      - dataPlaneName
      - environmentUUID
      - connectorUUID
      - status
      - isValid
      - database
      - containerName
      - settings
      type: object
    PayloadsSourceReaderSettingsPayload:
      properties:
        archiveLocationType:
          $ref: '#/components/schemas/EnumsMSSQLArchiveLocationType'
          description: 'SQL Server trn_log_backup only: where the transaction log
            backups are stored. Empty means a local directory on the reader.'
        archiveLogPassword:
          description: 'SQL Server trn_log_backup only: the SAS token for an Azure
            blob folder. Write-only: responses return a placeholder when one is saved,
            and sending the placeholder keeps it.'
          type:
          - "null"
          - string
        archiveLogPath:
          description: 'SQL Server trn_log_backup only: the folder holding the transaction
            log backups, such as an Azure blob folder URL. An SMB share''s path is
            on its connector instead.'
          type:
          - "null"
          - string
        archiveLogPrivateLinkUUID:
          deprecated: true
          description: 'No longer used: an SMB share''s PrivateLink is on its connector
            (archiveConnectorUUID).'
          format: uuid
          type:
          - "null"
          - string
        archiveLogUsername:
          deprecated: true
          description: 'No longer used: an SMB share''s login is on its connector
            (archiveConnectorUUID).'
          type:
          - "null"
          - string
        backfillBatchSize:
          description: Rows read per batch during backfills, also used as the Postgres
            streaming batch size. At most 50,000; new source readers start at 25,000.
          minimum: 0
          type:
          - "null"
          - integer
        backfillDefaults:
          $ref: '#/components/schemas/PayloadsBackfillDefaultsPayload'
          description: Default backfill tuning for this source reader's tables; a
            table's own backfill settings take precedence.
        collectionScopedMode:
          description: 'MongoDB only: open one change stream per collection. Order
            is kept within each collection but not across them.'
          type:
          - "null"
          - boolean
        compositeTypesAsText:
          description: 'Postgres only: replicate composite (row) type columns as their
            text form, such as (book,abc123), instead of base64-encoded bytes.'
          type:
          - "null"
          - boolean
        databasesToSync:
          description: The databases to merge tables from when unifyAcrossDatabases
            is on.
          items:
            type: string
          type:
          - "null"
          - array
        deploymentScopedMode:
          description: 'MongoDB only: stream every table from one change stream for
            the whole deployment; each table''s schema holds its database, so one
            pipeline can cover several databases.'
          type:
          - "null"
          - boolean
        disableAutoFetchTables:
          description: 'Dashboard only: require picking a schema before tables are
            listed, instead of listing every table up front.'
          type:
          - "null"
          - boolean
        disableFullDocumentBeforeChange:
          description: 'MongoDB/DocumentDB only: don''t request the pre-image (fullDocumentBeforeChange)
            on change streams, which DocumentDB doesn''t support.'
          type:
          - "null"
          - boolean
        disableNoCursorTimeout:
          description: 'MongoDB/DocumentDB only: don''t set noCursorTimeout on the
            backfill cursor.'
          type:
          - "null"
          - boolean
        enableClientSideFullDocumentLookup:
          description: 'MongoDB/DocumentDB only: look up the full document for update
            events with a separate query instead of updateLookup, avoiding BSONObjectTooLarge
            errors past 16 MB.'
          type:
          - "null"
          - boolean
        enableHeartbeats:
          description: 'Postgres only: write to Artie''s heartbeat table every 5 minutes
            so the replication slot keeps advancing when the captured tables are quiet.'
          type:
          - "null"
          - boolean
        enableRelationMessageCaching:
          description: 'Postgres only: cache relation messages and skip the schema
            change check on each one.'
          type:
          - "null"
          - boolean
        enableSchemaHistoryCompaction:
          description: 'MySQL only: on startup, rebuild the schema history from the
            source and replace the append-only history file with the compacted version.'
          type:
          - "null"
          - boolean
        maxConnIdleTimeSeconds:
          description: 'Postgres only: close pooled connections idle this many seconds,
            up to 86400. 0 uses the driver default.'
          type:
          - "null"
          - integer
        messageCompression:
          description: Set to gzip to gzip-compress each whole Kafka message value.
            Can't be combined with column-level compression.
          enum:
          - gzip
          - ""
          - null
          type:
          - "null"
          - string
        mssqlChangeTrackingConcurrency:
          description: 'SQL Server change tracking only: how many tables are processed
            in parallel. 0 uses the default of 10.'
          type:
          - "null"
          - integer
        mssqlChangeTrackingMaxIdleConns:
          description: 'SQL Server change tracking only: the most idle database connections
            to keep. 0 uses the default of 10.'
          type:
          - "null"
          - integer
        mssqlChangeTrackingPollIntervalMs:
          description: 'SQL Server change tracking only: milliseconds to wait before
            polling again when there are no new changes. 0 uses the default of 2500.'
          minimum: 0
          type:
          - "null"
          - integer
        mssqlReplicationMethod:
          description: 'SQL Server only: how changes are captured. Empty uses CDC
            capture instances.'
          type:
          - "null"
          - string
        oneTopicPerSchema:
          description: 'Oracle only: send every table in a schema to a single Kafka
            topic.'
          type:
          - "null"
          - boolean
        publicationAutoCreateMode:
          description: 'Postgres only: empty lets Artie create the publication FOR
            ALL TABLES if it''s missing; filtered means Artie won''t create it, so
            you manage which tables it covers.'
          type:
          - "null"
          - string
        publicationNameOverride:
          description: 'Postgres only: the publication to read from. Empty uses dbz_publication.'
          type:
          - "null"
          - string
        publishViaPartitionRoot:
          description: 'Postgres only: create the publication with publish_via_partition_root,
            so changes to partitions are published as the parent table.'
          type:
          - "null"
          - boolean
        replicationSlotOverride:
          description: 'Postgres only: the replication slot to read from. Empty uses
            artie.'
          type:
          - "null"
          - string
        rescaleTimestampsPastYear9999:
          description: 'Postgres only: read a timestamp (without time zone) past year
            9999 as an epoch stored at 1000x precision and scale it back down.'
          type:
          - "null"
          - boolean
        s3PathMappings:
          description: 'S3 sources only: which objects in the bucket feed which destination
            table.'
          items:
            $ref: '#/components/schemas/PayloadsS3PathMapping'
          type:
          - "null"
          - array
        unifyAcrossDatabases:
          description: Merge tables with the same schema and name from several databases
            (databasesToSync or unifyAcrossDatabasesRegex) into one destination table.
          type:
          - "null"
          - boolean
        unifyAcrossDatabasesRegex:
          description: Regex matching the databases or keyspaces to merge tables from.
            Where supported it replaces databasesToSync.
          type:
          - "null"
          - string
        unifyAcrossSchemas:
          description: Merge tables with the same name from every schema matching
            unifyAcrossSchemasRegex into one destination table. Applies to tables
            that also turn it on.
          type:
          - "null"
          - boolean
        unifyAcrossSchemasMaxParallelism:
          description: How many schemas a unified table backfills at once. 0 uses
            the default of 1 (serial).
          maximum: 3
          minimum: 0
          type:
          - "null"
          - integer
        unifyAcrossSchemasRegex:
          description: Regex matching the schemas whose same-named tables are merged
            when unifyAcrossSchemas is on.
          type:
          - "null"
          - string
        useAdvanceOnPrimaryKeepAlive:
          description: 'Postgres only: advance the slot''s position on primary keepalive
            messages. Suited to dev or staging, since long-running transactions can
            make the WAL position jump.'
          type:
          - "null"
          - boolean
        useFailoverReplicationSlot:
          description: 'Postgres 17+ only: create the logical replication slot as
            a failover slot, synchronized to physical standbys.'
          type:
          - "null"
          - boolean
        useNumericTypesForMoney:
          description: 'SQL Server only: read MONEY as NUMERIC(19,4) and SMALLMONEY
            as NUMERIC(10,4).'
          type:
          - "null"
          - boolean
        useOracleRowIDRanges:
          description: 'Oracle only: backfill eligible tables in ROWID ranges, in
            storage order, instead of paging by primary key. Needs Oracle 19c+ and
            SELECT on V$DATABASE, DBA_EXTENTS, DBA_OBJECTS and DBA_SEGMENTS; without
            them backfills fail.'
          type:
          - "null"
          - boolean
        useReaderForOracleStreaming:
          description: 'Oracle only: stream changes with Artie Reader (LogMiner) instead
            of Debezium.'
          type:
          - "null"
          - boolean
      type: object
    PayloadsSourceReaderTable:
      properties:
        excludeColumns:
          description: Columns the reader drops at the source, overriding each pipeline
            table's own list when set.
          items:
            type: string
          type: array
        includeColumns:
          description: The only columns to read, overriding each pipeline table's
            own list when set.
          items:
            type: string
          type: array
        name:
          description: The table (or collection) name in the source.
          type: string
        schema:
          description: The table's schema. For MongoDB in deploymentScopedMode, its
            database.
          type: string
        unifyAcrossDatabases:
          description: Merge this table across databases, when the source reader's
            unifyAcrossDatabases setting is on. Only PlanetScale checks it per table.
          type: boolean
        unifyAcrossSchemas:
          description: Merge this table across schemas, when the source reader's unifyAcrossSchemas
            setting is on.
          type: boolean
      type: object
    PayloadsSourceReaderTablesConfig:
      additionalProperties:
        $ref: '#/components/schemas/PayloadsSourceReaderTable'
      type:
      - "null"
      - object
    PayloadsSpecificConfig:
      properties:
        bucketName:
          description: 'S3, GCS and Delta Lake only: the bucket to write to.'
          type: string
        checkpointInterval:
          description: 'Delta Lake only: commits per table between checkpoints. Defaults
            to 10; -1 turns checkpoints off.'
          type: integer
        compaction:
          $ref: '#/components/schemas/PayloadsCompactionConfig'
          description: 'Delta Lake only: Transfer''s scheduled compaction settings.'
        containerName:
          description: 'Oracle only: the container name used to connect.'
          type: string
        database:
          description: The destination database; for BigQuery, the dataset, and for
            Oracle, the service name.
          type: string
        dynamicallyCreateNamespaces:
          description: When true, deploys create missing destination schemas (databases
            in MySQL) and skip namespace validation. Ignored for Oracle.
          type: boolean
        externalStageName:
          description: 'Snowflake only: the external stage to load data through; empty
            doesn''t use one.'
          type: string
        externalStageS3Bucket:
          description: 'Snowflake only: the S3 bucket behind the external stage.'
          type: string
        externalStageS3Prefix:
          description: 'Snowflake only: the path prefix in the external stage''s bucket.'
          type: string
        folderName:
          description: 'S3, GCS and Delta Lake only: the folder in the bucket to write
            under.'
          type: string
        icebergFormatVersion:
          description: 'Iceberg only: the format new tables are created with on REST
            catalogs with the native engine; empty means v2. Tables can''t be downgraded
            from v3.'
          enum:
          - v2
          - v3
          type: string
        schema:
          description: Destination schema for every table when useSameSchemaAsSource
            is false.
          type: string
        schemaNamePrefix:
          description: Prefix added to source schema names when useSameSchemaAsSource
            is true.
          type: string
        tableNameSeparator:
          description: 'S3, GCS and Delta Lake only: separator between the parts of
            a table''s name in object paths; defaults to /.'
          type: string
        useSameSchemaAsSource:
          description: When true, each table goes to a destination schema named after
            its source schema, with schemaNamePrefix; otherwise every table goes to
            schema.
          type: boolean
      type: object
    PayloadsStaticColumn:
      properties:
        column:
          description: Name of the column added to every destination table.
          type: string
        value:
          description: The value written to that column on every row.
          type: string
      type: object
    PayloadsTable:
      properties:
        advancedSettings:
          $ref: '#/components/schemas/PayloadsTableAdvancedSettings'
          description: The table's advanced settings.
        backfillStages:
          description: Every stage the regular table's backfills reached, oldest first;
            the last entry is the current stage.
          items:
            $ref: '#/components/schemas/PayloadsBackfillStageEvent'
          type: array
        createdAt:
          description: When the table was added to the pipeline, in RFC 3339.
          format: date-time
          type: string
        destinationTableName:
          description: The table's name in the destination, after the alias and schema
            prefix rules. Empty when the pipeline has no destination.
          type: string
        disableReplication:
          deprecated: true
          description: 'Deprecated: true when the regular table is paused but its
            history table isn''t.'
          type: boolean
        enableHistoryMode:
          description: True when every change is also written to a <table>__history
            table.
          type: boolean
        historyBackfillStages:
          description: Every stage the history table's backfills reached, oldest first;
            the last entry is the current stage.
          items:
            $ref: '#/components/schemas/PayloadsBackfillStageEvent'
          type: array
        historyTableStatus:
          description: 'The history table''s replication state. Use enableHistoryMode
            to tell whether the table has a history table: a paused table without
            history mode reports paused here, and a new history table reports nothing
            until it is deployed.'
          type: string
        individualDeployment:
          description: True when the table runs in its own Transfer deployment.
          type: boolean
        name:
          description: The source table's name.
          type: string
        schema:
          description: The source table's schema; for MySQL, its database.
          type: string
        status:
          description: The regular table's replication state.
          type: string
        updatedAt:
          description: When the table was last changed, in RFC 3339.
          format: date-time
          type: string
        uuid:
          description: The table's UUID, used for table updates and backfills.
          format: uuid
          type: string
      type: object
    PayloadsTableAdvancedSettings:
      properties:
        alias:
          description: Destination table name to use instead of the source table name.
          type: string
        backfillFromDatabases:
          description: Source databases the table's next backfill reads from, set
            by the backfill request; empty reads every database.
          items:
            type: string
          type:
          - array
          - "null"
        backfillFromSchemas:
          description: Source schemas the table's next backfill reads from, set by
            the backfill request; empty reads every schema.
          items:
            type: string
          type:
          - array
          - "null"
        bigQueryPartitionSettings:
          $ref: '#/components/schemas/PayloadsBigQuerySettings'
          description: 'Deprecated: use mergePredicates.'
        bufferRows:
          description: Rows to buffer before flushing to the destination, at least
            5.
          type: integer
        columnsToCompress:
          description: 'Postgres sources only: columns the reader gzip-compresses
            in transit. Transfer decompresses them before writing.'
          items:
            type: string
          type: array
        columnsToEncrypt:
          description: Columns whose values are encrypted with the pipeline's encryption
            key before they're written.
          items:
            type: string
          type: array
        columnsToHash:
          description: 'Columns whose values are hashed before they''re written: HMAC-SHA256
            with the pipeline''s column hashing salt, or SHA-256 without one.'
          items:
            type: string
          type: array
        columnsToTrim:
          description: String columns whose leading and trailing whitespace is removed
            before they're written.
          items:
            type: string
          type: array
        ctidSettings:
          $ref: '#/components/schemas/PayloadsCTIDSettings'
          description: Postgres CTID backfill settings for this table; omitted uses
            the source reader's backfill defaults.
        dynamicTableTargetLag:
          description: How often the latest rows refresh, such as 1 minute (Snowflake
            TARGET_LAG, Databricks TRIGGER ON UPDATE interval); empty uses Transfer's
            default. Only used with enableDynamicTable.
          type: string
        enableDynamicTable:
          description: 'Snowflake and Databricks only: stream changes into <table>__artie_changes,
            keep the latest row per key in a Snowflake dynamic table or Databricks
            streaming table, and make <table> a view over it.'
          type: boolean
        encryptJSONBColumns:
          description: When true, the table's JSONB columns are encrypted with the
            pipeline's encryption key.
          type: boolean
        endingPrimaryKey:
          description: Highest primary key value a restarted backfill reads; cleared
            once the backfill completes.
          type: string
        excludeColumns:
          description: Source columns to leave out of the destination. Can't be combined
            with includeColumns.
          items:
            type: string
          type: array
        flattenDocuments:
          description: When true, nested document fields are flattened into their
            own columns.
          type: boolean
        flattenDocumentsMaxDepth:
          description: How many levels of nesting flattenDocuments expands; 0 means
            no limit.
          minimum: 0
          type: integer
        flushIntervalSeconds:
          description: Seconds between flushes to the destination, from 5 to 86400.
            Transfer flushes sooner when bufferRows or flushSizeKb is reached.
          type: integer
        flushSizeKb:
          description: Buffered data, in KB, that triggers a flush to the destination,
            up to 1.5 GB.
          type: integer
        historyTableBackfillFromSchemas:
          items:
            type: string
          type:
          - array
          - "null"
        includeColumns:
          description: The only source columns to write to the destination. Can't
            be combined with excludeColumns.
          items:
            type: string
          type: array
        k8sRequestCPU:
          description: CPU request for the table's own Transfer pod, in millicores.
            Only used with individualDeployment.
          minimum: 0
          type: integer
        k8sRequestMemoryMB:
          description: Memory request for the table's own Transfer pod, in MiB. Only
            used with individualDeployment.
          minimum: 0
          type: integer
        keepOldSwapTable:
          description: When true, a swap_table backfill keeps the destination table's
            old rows in a separate table after the swap.
          type: boolean
        mergePredicates:
          description: Partition columns Transfer adds to its MERGE condition.
          items:
            $ref: '#/components/schemas/PayloadsMergePredicates'
          type: array
        msmFlushCount:
          description: 'Multi-step merge: how many flushes Transfer stages before
            merging into the destination table; 0 turns it off.'
          minimum: 0
          type: integer
        partitionRangeSettings:
          $ref: '#/components/schemas/PayloadsPartitionRangeSettings'
          description: 'Postgres sources only: backfill a partitioned table by reading
            each partition. Cannot be enabled together with rangeSettings or ctidSettings.'
        previousSwapTableSuffix:
          description: Suffix of the previous swap_table backfill's table, dropped
            before the next one starts.
          type: string
        primaryKeysOverride:
          description: Columns to use as the destination primary key instead of the
            source table's primary key.
          items:
            type: string
          type:
          - array
          - "null"
        rangeSettings:
          $ref: '#/components/schemas/PayloadsRangeSettings'
          description: Range backfill settings for this table; omitted uses the source
            reader's backfill defaults.
        shouldBackfillHistoryTable:
          description: When true, the history table is backfilled too; otherwise only
            the regular table is.
          type:
          - "null"
          - boolean
        skipBackfill:
          description: When true, the table skips its initial backfill and starts
            streaming when first deployed.
          type: boolean
        skipDelete:
          description: When true, delete events are skipped, so rows deleted in the
            source stay in the destination.
          type: boolean
        skipNoOpUpdates:
          description: 'Postgres sources only: skip update events whose before and
            after rows are identical after column filters. Requires REPLICA IDENTITY
            FULL.'
          type: boolean
        softPartitioning:
          $ref: '#/components/schemas/PayloadsSoftPartitioning'
          description: Splits the destination table into time-based partition tables.
        startingPrimaryKey:
          description: Lowest primary key value a restarted backfill reads; cleared
            once the backfill completes.
          type: string
        streamARN:
          description: 'Amazon Keyspaces only: the table''s CDC stream ARN.'
          type: string
        swapTableSuffix:
          description: Suffix of the table a swap_table backfill loads into. Kept
            after the backfill so the next one can drop that table.
          type: string
        unifyAcrossDatabases:
          description: When the source reader unifies across databases, this table
            is read from every matching database into one destination table. Only
            PlanetScale reads it per table.
          type: boolean
        unifyAcrossSchemas:
          description: 'Postgres and MySQL: when the source reader unifies across
            schemas, this table is read from every matching schema into one destination
            table.'
          type: boolean
      type: object
    PayloadsTablePayload:
      properties:
        advancedSettings:
          $ref: '#/components/schemas/PayloadsAdvancedTableSettingsPayload'
          description: Table settings to change; omitted fields keep their current
            values. Nested objects (softPartitioning, rangeSettings, ctidSettings,
            partitionRangeSettings) replace the current value whole.
        disableReplication:
          deprecated: true
          description: 'Deprecated: use status instead. True pauses only the regular
            table and keeps its history table replicating; false resumes it.'
          type:
          - "null"
          - boolean
        enableHistoryMode:
          description: 'When true, every change is also written to a <table>__history
            table. Always applied: leaving it out of an update turns history mode
            off.'
          type: boolean
        individualDeployment:
          description: When true, the table runs in its own Transfer deployment, which
            allows per-table resources and flush settings. Omitted keeps the current
            value.
          type:
          - "null"
          - boolean
        name:
          description: The source table's name. Always applied on update.
          type: string
        schema:
          description: The source table's schema; for MySQL, its database. Always
            applied on update.
          type: string
        status:
          description: Set to paused to pause the table or streaming to resume it.
            Omitted keeps the current status; new tables start as draft.
          type:
          - "null"
          - string
        uuid:
          description: The table's UUID from pipeline_detail, to update an existing
            table. Without it, the table with the same name and schema is updated
            (or the same name alone, for MongoDB and DocumentDB sources that match
            tables by name); a new table is added only when none matches.
          format: uuid
          type: string
      type: object
