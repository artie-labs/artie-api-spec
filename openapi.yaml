      required:
      - acls
      type: object
    RouterManagedKafkaUserRequest:
      properties:
        acls:
          description: What the user can do. Kafka refuses it everything else.
          items:
            $ref: '#/components/schemas/PayloadsKafkaUserACL'
          maxItems: 50
          minItems: 1
          type:
          - array
          - "null"
        username:
          description: Lowercase letters, digits, '.' and '-', at most 64 characters.
            admin and artie are the built-in logins.
          type: string
      required:
      - username
      - acls
      type: object
    RouterManagedKafkaUserWithPasswordResponse:
      properties:
        password:
