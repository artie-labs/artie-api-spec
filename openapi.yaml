          $ref: '#/components/schemas/PayloadsFullPipeline'
        sourceReader:
          $ref: '#/components/schemas/PayloadsSourceReader'
      required:
      - pipeline
      - sourceReader
      type: object
    RouterPipelineUsageResponse:
      properties:
        tableStats:
          items:
            $ref: '#/components/schemas/RouterPipelineTableStats'
