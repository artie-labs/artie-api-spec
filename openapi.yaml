      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_cancel_backfill_tables
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: safe-after-state-check
        title: Cancel table backfills
        triggerDescription: Stops a backfill that is queued or running and redeploys
          the pipeline. Pass table UUIDs from pipeline_detail in tableUUIDs for regular
          tables and in historyTableUUIDs for history tables; both are required, so
          send [] for the one you don't need. Returns 400 if none of them are backfilling.
  /pipelines/{uuid}/detect-schema-changes:
